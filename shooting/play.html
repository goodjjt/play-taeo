<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 450, H = 800;
// ---------- 사운드 ----------
let ac = null, muted = false, noiseBuf = null, master = null;
function initAudio(){
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 6;
      master = ac.createGain(); master.gain.value = 0.9;
      master.connect(comp).connect(ac.destination);
    } catch(e){ ac = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume().catch(()=>{});
  if (ac) initMusic();
}
// 레이저 발사음: 높은 음에서 뚝 떨어지는 "퓨웅" + 짧은 클릭
function laser(id, power){
  if (!ac || muted) return;
  const t = ac.currentTime, base = (id ? 1650 : 1300) * rand(0.94, 1.06);
  const vol = mode === 2 ? 0.032 : 0.042;
  const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(base, t); o.frequency.exponentialRampToValueAtTime(base*0.2, t + 0.09);
  f.type = 'lowpass'; f.frequency.setValueAtTime(4200, t); f.frequency.exponentialRampToValueAtTime(900, t + 0.09);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
  o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + 0.11);
  if (power >= 3){ // 파워가 높으면 묵직한 저음 한 겹 추가
    const o2 = ac.createOscillator(), g2 = ac.createGain();
    o2.type = 'triangle'; o2.frequency.setValueAtTime(220, t); o2.frequency.exponentialRampToValueAtTime(70, t + 0.08);
    g2.gain.setValueAtTime(vol*0.9, t); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    o2.connect(g2).connect(master); o2.start(t); o2.stop(t + 0.1);
  }
}
function beep(f, d, type='square', v=0.05, slide=0){
  if (!ac || muted) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(master); o.start(t); o.stop(t + d + 0.02);
}
function noise(d, v, freq=1200){
  if (!ac || muted) return;
  if (!noiseBuf){ noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const a = noiseBuf.getChannelData(0); for (let i=0;i<a.length;i++) a[i] = Math.random()*2-1; }
  const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(60, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + d + 0.02);
}
const sfx = {
  shoot: (hi) => beep(hi ? 1400 : 1100, 0.06, 'sawtooth', 0.008, -700),
  hit:   () => beep(260, 0.04, 'square', 0.02, -100),
  pop:   () => { noise(0.28, 0.12, 1800); beep(140, 0.2, 'sine', 0.08, -90); },
  big:   () => { noise(0.6, 0.2, 2200); beep(90, 0.5, 'sine', 0.12, -50); },
  power: () => { beep(660, 0.1, 'triangle', 0.07); setTimeout(() => beep(1320, 0.18, 'triangle', 0.07), 70); },
  hurt:  () => { noise(0.4, 0.18, 900); beep(150, 0.35, 'sawtooth', 0.06, -100); },
  warn:  () => { for (let i=0;i<3;i++) setTimeout(() => { beep(440, 0.28, 'square', 0.05); beep(220, 0.28, 'sawtooth', 0.04); }, i*600); },
  win:   () => { noise(1.4, 0.3, 2600); [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.22,'triangle',0.07),300+i*110)); },
};

// ---------- 배경음악 (신스웨이브 시퀀서) ----------
let musicOn = true;
try { musicOn = localStorage.getItem('ppyong_music') !== 'off'; } catch(e){}
const BGM = { bus:null, delay:null, track:'calm', want:'calm', step:0, nextT:0, timer:null };
const BPM = 124, STEP = 60 / BPM / 4;
const mtof = n => 440 * Math.pow(2, (n - 69) / 12);
const PROG = {
  calm: [[57,60,64,67],[53,57,60,64],[48,52,55,59],[55,59,62,65]],   // Am7 Fmaj7 Cmaj7 G7
  play: [[57,60,64],[53,57,60],[48,52,55],[55,59,62]],               // Am F C G
  boss: [[50,53,57],[46,50,53],[43,46,50],[45,49,52]],               // Dm Bb Gm A
};
function getNoise(){
  if (!noiseBuf){ noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const a = noiseBuf.getChannelData(0); for (let i=0;i<a.length;i++) a[i] = Math.random()*2-1; }
  return noiseBuf;
}
function initMusic(){
  if (BGM.bus) return;
  BGM.bus = ac.createGain(); BGM.bus.gain.value = 0; BGM.bus.connect(master);
  // 아르페지오용 딜레이(에코)
  const d = ac.createDelay(1), fb = ac.createGain(), wet = ac.createGain(), lp = ac.createBiquadFilter();
  d.delayTime.value = STEP * 3; fb.gain.value = 0.38; wet.gain.value = 0.32; lp.type = 'lowpass'; lp.frequency.value = 2400;
  d.connect(lp).connect(fb).connect(d); lp.connect(wet).connect(BGM.bus);
  BGM.delay = d;
  BGM.nextT = ac.currentTime + 0.1;
  BGM.timer = setInterval(musicTick, 25);
}
function env(g, t, a, peak, rel){
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + rel);
}
function mKick(t, v=0.55){
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.13);
  env(g, t, 0.003, v, 0.22); o.connect(g).connect(BGM.bus); o.start(t); o.stop(t + 0.26);
}
function mNoise(t, type, freq, v, len){
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = getNoise(); f.type = type; f.frequency.value = freq; if (type==='bandpass') f.Q.value = 0.8;
  env(g, t, 0.002, v, len); s.connect(f).connect(g).connect(BGM.bus);
  s.start(t, Math.random()*0.5); s.stop(t + len + 0.02);
}
const mSnare = (t) => { mNoise(t, 'bandpass', 1900, 0.2, 0.16); const o = ac.createOscillator(), g = ac.createGain(); o.type='triangle'; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(120,t+0.08); env(g,t,0.002,0.12,0.09); o.connect(g).connect(BGM.bus); o.start(t); o.stop(t+0.12); };
const mHat = (t, open) => mNoise(t, 'highpass', 7500, open ? 0.05 : 0.04, open ? 0.14 : 0.035);
function mBass(t, note, len, v=0.13){
  const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
  o.type = 'sawtooth'; o.frequency.value = mtof(note);
  f.type = 'lowpass'; f.Q.value = 6; f.frequency.setValueAtTime(1400, t); f.frequency.exponentialRampToValueAtTime(220, t + len);
  env(g, t, 0.004, v, len); o.connect(f).connect(g).connect(BGM.bus); o.start(t); o.stop(t + len + 0.05);
}
function mArp(t, note, v=0.035){
  const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
  o.type = 'square'; o.frequency.value = mtof(note);
  f.type = 'lowpass'; f.frequency.value = 2600;
  env(g, t, 0.003, v, 0.11); o.connect(f).connect(g); g.connect(BGM.bus); g.connect(BGM.delay);
  o.start(t); o.stop(t + 0.16);
}
function mPad(t, chord, len, v=0.022){
  const f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'lowpass'; f.frequency.value = 1100;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.5); g.gain.setValueAtTime(v, t + len - 0.3); g.gain.linearRampToValueAtTime(0.0001, t + len + 0.2);
  f.connect(g).connect(BGM.bus);
  for (const n of chord) for (const det of [-8, 8]){
    const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(n); o.detune.value = det;
    o.connect(f); o.start(t); o.stop(t + len + 0.25);
  }
}
function mLead(t, note, len, v=0.03){
  const o = ac.createOscillator(), o2 = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
  o.type = 'sawtooth'; o2.type = 'square'; o.frequency.value = mtof(note); o2.frequency.value = mtof(note); o2.detune.value = 10;
  f.type = 'lowpass'; f.frequency.value = 3000;
  env(g, t, 0.01, v, len); o.connect(f); o2.connect(f); f.connect(g); g.connect(BGM.bus); g.connect(BGM.delay);
  o.start(t); o2.start(t); o.stop(t + len + 0.05); o2.stop(t + len + 0.05);
}
const BOSS_LEAD = [74,null,72,74, null,77,76,74, 72,null,69,null, 70,72,74,null];
function playStep(step, t){
  const tr = BGM.track, bar = Math.floor(step/16) % 4, s = step % 16, chord = PROG[tr][bar], root = chord[0];
  if (tr === 'calm'){
    if (s === 0){ mPad(t, chord, STEP*16, 0.02); mBass(t, root-24, STEP*15, 0.1); }
    if (s % 2 === 0){ const seq = [0,1,2,3,2,1,0,2]; mArp(t, chord[seq[(s/2)%8] % chord.length] + 12, 0.022); }
    if (s === 8) mHat(t, true);
    return;
  }
  const boss = tr === 'boss';
  // 드럼
  if (s % 4 === 0 || (boss && s === 14)) mKick(t);
  if (s === 4 || s === 12) mSnare(t);
  if (boss ? true : s % 2 === 0) mHat(t, s % 4 === 2);
  // 베이스: 일반은 8분 옥타브, 보스는 16분 질주
  if (boss) mBass(t, root - 24 + (s % 4 === 2 ? 12 : 0), STEP*0.9, 0.12);
  else if (s % 2 === 0) mBass(t, root - 24 + (s % 4 === 2 ? 12 : 0), STEP*1.6);
  // 패드
  if (s === 0) mPad(t, chord, STEP*16, boss ? 0.018 : 0.02);
  // 아르페지오
  const pat = [0,1,2,3, 2,1,0,1, 0,1,2,3, 2,3,2,1];
  const tones = [chord[0], chord[1], chord[2], chord[0]+12];
  if (boss || level >= 2 || s % 2 === 0) mArp(t, tones[pat[s]] + 12, boss ? 0.03 : 0.028);
  // 보스 리드 멜로디
  if (boss){ const n = BOSS_LEAD[s]; if (n && bar % 2 === 0) mLead(t, n - (bar === 2 ? 3 : 0), STEP*1.8); }
}
function musicTick(){
  if (!ac || !BGM.bus) return;
  // 상황에 맞는 곡 고르기
  BGM.want = (state === 'title' || state === 'over' || state === 'select' || state === 'allclear') ? 'calm' : (boss || warnT > 0) ? 'boss' : 'play';
  const vol = (!musicOn || muted) ? 0 : state === 'pause' ? 0.15 : 0.55;
  BGM.bus.gain.setTargetAtTime(vol, ac.currentTime, 0.15);
  if (BGM.nextT < ac.currentTime - 0.2) BGM.nextT = ac.currentTime + 0.05; // 탭 전환 등으로 밀렸을 때
  while (BGM.nextT < ac.currentTime + 0.12){
    if (BGM.step % 16 === 0 && BGM.want !== BGM.track){ BGM.track = BGM.want; BGM.step = 0; }
    if (vol > 0) playStep(BGM.step, BGM.nextT);
    BGM.nextT += STEP; BGM.step = (BGM.step + 1) % 64;
  }
}
function toggleMusic(){ musicOn = !musicOn; try { localStorage.setItem('ppyong_music', musicOn ? 'on' : 'off'); } catch(e){} }


// ---------- 유틸 ----------
const rand = (a,b) => a + Math.random() * (b - a);
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const circle = (x,y,r) => { ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); };
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); }
function hexA(hex, a){ const n = parseInt(hex.slice(1), 16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
const FONT = 'Orbitron, "Black Han Sans", sans-serif';
function txt(s,x,y,size,color='#fff',align='center',glowC=null,weight=900){
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(2, size/7); ctx.strokeStyle = 'rgba(5,4,20,.9)'; ctx.lineJoin = 'round';
  ctx.strokeText(s,x,y);
  if (glowC){ ctx.shadowColor = glowC; ctx.shadowBlur = size*0.7; }
  ctx.fillStyle = color; ctx.fillText(s,x,y);
  ctx.shadowBlur = 0;
}
const mkCanvas = (w,h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const glowCache = {};
function glowSprite(col){
  if (glowCache[col]) return glowCache[col];
  const c = mkCanvas(64,64), g = c.getContext('2d'), gr = g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0, hexA('#ffffff', 1)); gr.addColorStop(0.12, hexA(col, 0.95)); gr.addColorStop(0.4, hexA(col, 0.35)); gr.addColorStop(1, hexA(col, 0));
  g.fillStyle = gr; g.fillRect(0,0,64,64);
  return glowCache[col] = c;
}
function glow(x,y,r,col,a=1){ ctx.globalAlpha = a; ctx.drawImage(glowSprite(col), x-r, y-r, r*2, r*2); ctx.globalAlpha = 1; }
const additive = (fn) => { ctx.globalCompositeOperation = 'lighter'; fn(); ctx.globalCompositeOperation = 'source-over'; };
function makeVignette(){
  const c = mkCanvas(W, H), g = c.getContext('2d');
  const gr = g.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.78);
  gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,12,.55)');
  g.fillStyle = gr; g.fillRect(0,0,W,H);
  g.fillStyle = 'rgba(0,0,0,.05)'; for (let y=0;y<H;y+=3) g.fillRect(0,y,W,1);
  return c;
}
const vignette = makeVignette();

// ---------- 상태 ----------
let state = 'title', mode = 1, newBest = false;
const best = {1:0, 2:0};
try { best[1] = +localStorage.getItem('ppyong_best') || 0; best[2] = +localStorage.getItem('ppyong_best2') || 0; } catch(e){}
let players, pb, eb, en, items, parts, rings, texts, time, score, combo, comboT, spawnT, bossT, boss, shake, overT, level, bossCount;
let hitStop = 0, flash = 0, redFlash = 0, warnT = 0, bgT = 0;

const THEME = [
  {main:'#ff2e88', laser:'#ff4fa3', label:'1P'},
  {main:'#00e5ff', laser:'#3df2ff', label:'2P'},
];
const NEON = ['#ff2e88','#00e5ff','#7cff4f','#ffd400','#b44dff','#ff7a00'];
const ITEM_COL = {power:'#ffd400', heart:'#ff2e88', shield:'#00e5ff'};

function mkPlayer(id){
  const x = mode === 1 ? W/2 : (id === 0 ? W*0.32 : W*0.68);
  return {id, x, y:H-130, tx:x, ty:H-130, power:1, lives:3, inv:1.5, shield:0, fireT:id*0.05, shotN:0, alive:true, tilt:0, px:x, muzzle:0};
}
const live = () => players.filter(p => p.alive);
function nearest(x,y){
  let b = null, bd = 1e9;
  for (const p of live()){ const d = (p.x-x)**2 + (p.y-y)**2; if (d < bd){ bd = d; b = p; } }
  return b || players[0];
}
function reset(){
  players = mode === 1 ? [mkPlayer(0)] : [mkPlayer(0), mkPlayer(1)];
  pb=[]; eb=[]; en=[]; items=[]; parts=[]; rings=[]; texts=[];
  time=0; score=0; combo=0; comboT=0; spawnT=1.2; bossT=45; boss=null; shake=0; level=1; overT=0; bossCount=0; newBest=false;
  hitStop=0; flash=0; redFlash=0; warnT=0;
  drags.clear();
  debris.length = 0;
}

// ================= 스테이지 시스템 (8섹터 × 10스테이지 = 80) =================
const SECTORS = [
  {name:'네온 시티',     hue:265, grid:'#ff2e88', pal:['#ff2e88','#00e5ff','#b44dff'], boss:'가디언 MK-1'},
  {name:'사이버 해협',   hue:212, grid:'#00e5ff', pal:['#00e5ff','#4dffb8','#7c9cff'], boss:'타이드 브레이커'},
  {name:'홀로 사막',     hue:25,  grid:'#ffb000', pal:['#ffb000','#ff7a00','#ffe066'], boss:'선 이터'},
  {name:'크롬 정글',     hue:140, grid:'#7cff4f', pal:['#7cff4f','#00ffa2','#d4ff3a'], boss:'바이퍼 퀸'},
  {name:'플라즈마 협곡', hue:315, grid:'#ff4fd8', pal:['#ff4fd8','#b44dff','#ff2e88'], boss:'플라즈마 히드라'},
  {name:'빙결 궤도',     hue:196, grid:'#9ff7ff', pal:['#9ff7ff','#ffffff','#4dc3ff'], boss:'프로스트 타이탄'},
  {name:'붉은 성운',     hue:355, grid:'#ff3864', pal:['#ff3864','#ff7a00','#ff4fd8'], boss:'네뷸라 로드'},
  {name:'코어 차원',     hue:282, grid:'#ffd400', pal:['#ffd400','#ff2e88','#00e5ff'], boss:'코어 오버로드'},
];
const sectorOf = n => Math.min(7, Math.floor((n-1)/10));
let stage = 1, stagePhase = 'intro', phaseT = 0, script = [], scriptT = 0, stageTotal = 1, stageResolved = 0, stageHurt = false, clearInfo = null, sel = 1;
const unlocked = {1:1, 2:1};
try { unlocked[1] = clamp(+localStorage.getItem('ppyong_stage1') || 1, 1, 81); unlocked[2] = clamp(+localStorage.getItem('ppyong_stage2') || 1, 1, 81); } catch(e){}
function saveUnlock(){ try { localStorage.setItem('ppyong_stage'+mode, unlocked[mode]); } catch(e){} }

function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function addPattern(ev, p, t, n, R, col){
  const r = (a,b) => a + R()*(b-a), cnt = k => k + Math.floor(n/15);
  switch(p){
    case 'line':   { const k = Math.min(8, cnt(4)); for (let i=0;i<k;i++) ev.push({t, type:'drone', x:(i+0.5)/k*W*0.85 + W*0.075, vx:0, color:col}); break; }
    case 'v':      { const k = Math.min(4, cnt(2)), cx = r(130, W-130); ev.push({t, type:'drone', x:cx, vx:0, color:col});
                     for (let i=1;i<=k;i++){ ev.push({t:t+i*0.22, type:'drone', x:cx-i*32, vx:0, color:col}); ev.push({t:t+i*0.22, type:'drone', x:cx+i*32, vx:0, color:col}); } break; }
    case 'column': { const x = r(60, W-60), k = Math.min(8, cnt(5)); for (let i=0;i<k;i++) ev.push({t:t+i*0.28, type:'drone', x, vx:0, color:col}); break; }

function buildStage(n){

  if (n >= 35) pats.push('fortress', 'swarm');
  const waves = isBoss ? 3 + Math.floor(sec/3) : Math.min(12, 4 + Math.floor(n/7));
  const gap = Math.max(1.4, 3.4 - n*0.025);
  const ev = []; let t = 0.4;

    const p = (isElite && w === waves-1) ? 'elite' : pick(pats);

    t += gap + (['tank','fortress','elite'].includes(p) ? 1.5 : 0);

// 1) 셰이더 바닥: 네온 그리드 + 비트 펄스 + 파동 링 + 스캔 라인
const floorMat = new THREE.ShaderMaterial({
  uniforms:{ uTime:{value:0}, uScroll:{value:0}, uPulse:{value:999}, uBeat:{value:0},
    uCol:{value:new THREE.Color()}, uCol2:{value:new THREE.Color()}, uBase:{value:new THREE.Color()}, uFog:{value:new THREE.Color()} },
  vertexShader:`varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader:`
    uniform float uTime, uScroll, uPulse, uBeat; uniform vec3 uCol, uCol2, uBase, uFog; varying vec3 vW;
    float gridLine(vec2 p, float s, float w){ vec2 q = p / s; vec2 g = abs(fract(q - 0.5) - 0.5) / (fwidth(q) * w); return 1.0 - min(min(g.x, g.y), 1.0); }
    void main(){
      vec2 p = vec2(vW.x, vW.z - uScroll);
      float major = gridLine(p, 10.0, 1.4) * 0.6;
      float minor = gridLine(p, 2.5, 1.0) * 0.16;
      float d = length(vW.xz - vec2(0.0, -5.0));
      float ring = smoothstep(3.0, 0.0, abs(d - uPulse)) * (1.0 - smoothstep(30.0, 150.0, uPulse));
      float scan = smoothstep(2.0, 0.0, abs(mod(vW.z - uTime*30.0, 140.0) - 70.0));
      float lane = exp(-abs(vW.x) / 16.0);
      vec3 c = uBase + uCol * lane * 0.08;
      c += uCol * (major * (0.75 + uBeat * 0.9) + minor);
      c += uCol2 * ring * 1.6;
      c += uCol * scan * (0.1 + major * 0.9);
      float fogF = smoothstep(55.0, 175.0, length(vW - cameraPosition));
      gl_FragColor = vec4(mix(c, uFog, fogF), 1.0);
    }`,
});

const RANGE_L = 240;
const rangeLineMat = new THREE.MeshBasicMaterial({color:0xffffff, wireframe:true, transparent:true, opacity:0.55, fog:true});
const rangeFillMat = new THREE.MeshBasicMaterial({color:0x05020f, fog:true, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1});
function makeRangeGeo(side){
  const wdt = 80, geo = new THREE.PlaneGeometry(wdt, RANGE_L, 26, 64); geo.rotateX(-Math.PI/2);
  const pos = geo.attributes.position, k = Math.PI*2/RANGE_L;
  for (let i=0;i<pos.count;i++){
    const x = pos.getX(i), z = pos.getZ(i), u = side > 0 ? (x + wdt/2)/wdt : (wdt/2 - x)/wdt;
    const n = Math.sin(z*k*3 + side)*0.5 + Math.sin(z*k*7 + u*5)*0.3 + Math.sin(z*k*13 + u*11)*0.2;
    const h = Math.pow(u, 1.25) * (20 + 16*n) * (0.55 + 0.45*Math.abs(Math.sin(z*k*2 + u*3)));
    pos.setY(i, Math.max(0, h + Math.sin(z*k*29 + u*17)*0.8*u));
  }
  geo.computeVertexNormals(); return geo;
}
const ranges = [];
for (const side of [-1, 1]){
  const geo = makeRangeGeo(side);
  for (let c=0;c<2;c++){
    const g = new THREE.Group();
    g.add(new THREE.Mesh(geo, rangeFillMat), new THREE.Mesh(geo, rangeLineMat));
    g.position.set(side*(26 + 40), FLOOR_Y, 0); g.userData = {c}; scene.add(g); ranges.push(g);
  }
}

// 3) 섹터 테마 소품 (도시 빌딩, 피라미드, 크리스탈, 얼음 파편, 소행성, 에너지 링 …)
const PROP_N = 26, PROP_SPAN = 240;
const propRoot = new THREE.Group(); scene.add(propRoot);
let props = [], propSector = -1;
const PROP_GEO = {
  box: new THREE.BoxGeometry(1,1,1),
  pyramid: (() => { const g = new THREE.ConeGeometry(0.75,1,4); g.rotateY(Math.PI/4); return g; })(),
  crystal: (() => { const g = new THREE.OctahedronGeometry(0.5); g.scale(0.6,1.6,0.6); return g; })(),
  pillar: new THREE.CylinderGeometry(0.35,0.55,1,5),
  shard: new THREE.TetrahedronGeometry(0.8),
  rock: new THREE.IcosahedronGeometry(0.7,0),
  ring: new THREE.TorusGeometry(1,0.08,6,32),
  beacon: new THREE.CylinderGeometry(0.08,0.08,1,6),
  plat: new THREE.CylinderGeometry(1,1.1,0.4,8),
};
function buildProps(si){
  propSector = si; props = [];
  while (propRoot.children.length) propRoot.remove(propRoot.children[0]);
  const R = mulberry(si*131 + 7), r = (a,b) => a + R()*(b-a), pal = SECTORS[si].pal;
  for (let i=0;i<PROP_N;i++){
    const side = i % 2 ? 1 : -1, col = pal[i % 3], g = new THREE.Group(), L = [];
    const x = side * r(15, 33), z0 = -PROP_SPAN*0.8 + (i/PROP_N)*PROP_SPAN + r(-4,4);
    let y = FLOOR_Y, spin = 0, bob = 0, lightY = 0, s;
    switch(si){
      case 0: { // 네온 시티: 빌딩
        const h = r(4, 11), w = r(2.5, 5);
        const m = addNeon(g, PROP_GEO.box, col, L); m.scale.set(w, h, w); m.position.y = h/2;
        for (let k=1;k<4;k++){ const st = new THREE.Mesh(PROP_GEO.box, basicMat(col, 1.2)); st.scale.set(w*1.02, 0.12, w*1.02); st.position.y = h*k/4; g.add(st); }
        lightY = h + 0.5; break; }
      case 1: { // 사이버 해협: 부유 플랫폼 + 등대
        const m = addNeon(g, PROP_GEO.plat, col, L); s = r(2, 4); m.scale.set(s, 1, s); m.position.y = 1;
        const b = addNeon(g, PROP_GEO.beacon, col, L); const h = r(3, 8); b.scale.set(1, h, 1); b.position.y = 1 + h/2;
        lightY = h + 1.5; bob = r(0.5, 1.2); break; }
      case 2: { // 홀로 사막: 피라미드
        s = r(4, 9); const m = addNeon(g, PROP_GEO.pyramid, col, L); m.scale.set(s, s*0.8, s); m.position.y = s*0.4;
        lightY = s*0.8 + 0.6; break; }
      case 3: { // 크롬 정글: 크리스탈 군락
        for (let k=0;k<3;k++){ const m = addNeon(g, PROP_GEO.crystal, col, L); s = r(2, 4); m.scale.setScalar(s); m.position.set(r(-2,2), s*0.8, r(-2,2)); m.rotation.set(r(-0.3,0.3), r(0,3), r(-0.3,0.3)); }
        lightY = 7; break; }
      case 4: { // 플라즈마 협곡: 뾰족 기둥
        const h = r(5, 11); const m = addNeon(g, PROP_GEO.pillar, col, L); m.scale.set(r(2,4), h, r(2,4)); m.position.y = h/2; m.rotation.y = r(0,3);
        lightY = h + 0.5; break; }
      case 5: { // 빙결 궤도: 떠다니는 얼음 파편
        s = r(1.6, 3.5); const m = addNeon(g, PROP_GEO.shard, col, L); m.scale.setScalar(s); y = FLOOR_Y + r(4, 8); spin = r(0.2, 0.8); bob = r(0.6, 1.5); break; }
      case 6: { // 붉은 성운: 소행성

const streaks = [...Array(14)].map((_, i) => ({x:(i%2 ? 1 : -1)*rand(12, 30), z:rand(-170, 60), v:rand(50, 110), c:i%3}));

let bgScroll = 0, lastBgT = 0, pulseR = 999, nextPulse = 4;
function floorPulse(){ pulseR = 0; }
function updateBackground(sec, si, warp){
  const dt = Math.max(0, Math.min(0.05, bgT - lastBgT)); lastBgT = bgT;
  const speed = 14*warp;
  bgScroll += dt*speed;
  if (si !== propSector) buildProps(si);
  // 비트 (배경음악 박자에 맞춰 그리드가 맥동)
  let beat = 0;
  if (ac && BGM.bus && musicOn && !muted && BGM.track !== 'calm'){
    const pos = BGM.step - (BGM.nextT - ac.currentTime)/STEP;
    beat = Math.exp(-(((pos/4) % 1 + 1) % 1) * 7);
  } else beat = 0.25 + Math.sin(bgT*2)*0.1;
  pulseR += dt*70; nextPulse -= dt; if (nextPulse <= 0){ nextPulse = 7; if (pulseR > 160) pulseR = 0; }
  const u = floorMat.uniforms;
  u.uTime.value = bgT; u.uScroll.value = bgScroll; u.uPulse.value = pulseR; u.uBeat.value = beat;
  u.uCol.value.copy(col3(sec.grid)).multiplyScalar(0.7);
  u.uCol2.value.copy(col3(sec.pal[1]));
  u.uBase.value.setHSL(sec.hue/360, 0.75, 0.03);
  u.uFog.value.copy(scene.fog.color);
  // 산맥
  rangeLineMat.color.copy(col3(sec.pal[2] || sec.grid)).multiplyScalar(0.8);
  for (const g of ranges){ g.position.z = ((bgScroll + g.userData.c*RANGE_L) % (RANGE_L*2)) - RANGE_L*1.25; }
  // 소품
  for (const g of props){
    const d = g.userData;
    let z = ((d.z0 + bgScroll + PROP_SPAN*0.8) % PROP_SPAN + PROP_SPAN) % PROP_SPAN - PROP_SPAN*0.8;
    g.position.z = z; g.position.y = d.y + (d.bob ? Math.sin(bgT*1.2 + d.ph)*d.bob : 0);
    if (d.spin){ g.rotation.y = bgT*d.spin + d.ph; g.rotation.x = Math.sin(bgT*d.spin*0.7 + d.ph)*0.6; }
    if (d.lightY && Math.sin(bgT*3 + d.ph) > -0.3) G(d.x, FLOOR_Y + d.lightY, z, 2.4, d.col, 0.9);
    if (d.spin && !d.lightY) G(d.x, g.position.y, z, 5, d.col, 0.25);
  }
  // 빛 줄기
  for (const s of streaks){
    s.z += s.v*warp*dt; if (s.z > 70){ s.z = -175; s.x = (Math.random() < 0.5 ? -1 : 1)*rand(12, 30); }
    const col = sec.pal[s.c];
    for (let k=0;k<7;k++) G(s.x, FLOOR_Y + 0.3, s.z - k*1.6, 1.6 - k*0.17, col, 1 - k*0.13);
  }
}

}

].map((d,i) => Object.assign(d, {t:i, flash:0, hp:1, maxhp:1, vx:0, vy:100, warped:true, wt:1}));
const titleShips = [{id:0,x:W/2-60,y:470,alive:true,inv:0,shield:0,tilt:0,muzzle:0},{id:1,x:W/2+60,y:470,alive:true,inv:0,shield:0,tilt:0,muzzle:0}];

// ---------- 업데이트 ----------
function update(rdt){
  let dt = rdt;
  if (hitStop > 0){ hitStop -= rdt; dt = rdt * 0.12; }
  const bdt = state==='pause' ? 0 : dt;
  bgT += bdt;
  for (const p of parts){ p.x += p.vx*bdt; p.y += p.vy*bdt; p.h += p.vh*bdt; const f = p.k==='spark' ? 0.93 : 0.95; p.vx *= f; p.vy *= f; p.vh *= f; p.life -= bdt; }
  parts = parts.filter(p => p.life > 0);
  for (const d of debris){ d.x += d.vx*bdt; d.y += d.vy*bdt; d.h += d.vh*bdt; d.vh -= 650*bdt; d.vx *= 0.985; d.vy *= 0.985; d.rx += d.wx*bdt; d.ry += d.wy*bdt; d.life -= bdt; }
  for (let i = debris.length-1; i >= 0; i--) if (debris[i].life <= 0) debris.splice(i, 1);
  for (const r of rings){ r.life -= bdt; r.r = r.max * (1 - Math.pow(Math.max(0,r.life)/r.ml, 2.2)); }
  rings = rings.filter(r => r.life > 0);
  for (const t of texts){ t.y -= 40*bdt; t.life -= bdt; }
  texts = texts.filter(t => t.life > 0);
  shake = Math.max(0, shake - 45*bdt);
  flash = Math.max(0, flash - rdt*1.8); redFlash = Math.max(0, redFlash - rdt*2);
  if (state==='title' || state==='select' || state==='allclear'){
    for (const d of demo) d.t += rdt;
    titleShips[0].y = 470 + Math.sin(bgT*2)*8; titleShips[1].y = 470 + Math.sin(bgT*2+1.5)*8;
    titleShips[0].tilt = Math.sin(bgT*1.3)*0.4; titleShips[1].tilt = -Math.sin(bgT*1.3)*0.4;
    for (const s of titleShips) engineTrail(s);
  }
  if (state==='over' || state==='allclear') overT += rdt;
  if (state==='allclear' && Math.random() < 0.06) boom(rand(60, W-60), rand(150, 600), NEON[Math.floor(Math.random()*NEON.length)], 26);
  if (state !== 'play') return;

  time += dt;
  if (warnT > 0) warnT -= dt;

  const p1 = players[0], p2 = players[1];
  keyMove(p1, 'KeyW','KeyS','KeyA','KeyD');
  if (mode === 1) keyMove(p1, 'ArrowUp','ArrowDown','ArrowLeft','ArrowRight');
  else keyMove(p2, 'ArrowUp','ArrowDown','ArrowLeft','ArrowRight');
  const k = Math.min(1, dt*16);
  for (const p of players){
    p.tx = clamp(p.tx, 20, W-20); p.ty = clamp(p.ty, 60, H-34);
    if (!p.alive) continue;
    p.px = p.x;
    p.x += (p.tx-p.x)*k; p.y += (p.ty-p.y)*k;
    const vx = dt > 0 ? (p.x - p.px)/dt : 0;
    p.tilt += (clamp(vx/500,-1,1) - p.tilt) * Math.min(1, dt*10);
    p.inv = Math.max(0, p.inv-dt); p.shield = Math.max(0, p.shield-dt); p.muzzle = Math.max(0, p.muzzle-dt);
    p.fireT -= dt; if (p.fireT <= 0){ p.fireT = 0.11; fire(p); }
    engineTrail(p);
  }
  for (const b of pb){ b.x += b.vx*dt; b.y += b.vy*dt; }
  pb = pb.filter(b => b.y > -60 && b.x > -20 && b.x < W+20);

  // 스테이지 진행
  phaseT += dt;
  if (stagePhase === 'intro'){ if (phaseT > 2.2){ stagePhase = 'fight'; phaseT = 0; } }
  else if (stagePhase === 'fight'){
    scriptT += dt;
    while (script.length && script[0].t <= scriptT){ const ev = script.shift(); if (ev.type === 'boss') spawnBoss(); else makeEnemy(ev); }
    if (!script.length && en.length === 0 && !boss) stageClear();
  } else if (stagePhase === 'clear'){ if (phaseT > 3.4) nextStage(); }

  for (const e of en){
    e.t += dt; if (e.flash > 0) e.flash -= dt;
    e.punch = Math.max(0, (e.punch||0) - dt*6); if (e.recoil) e.recoil = Math.max(0, e.recoil - dt*4);
    if (!e.warped && e.type !== 'boss' && e.y > -e.r*0.6){
      e.warped = true; e.wt = 0;
      rings.push({x:e.x, y:e.y, r:0, max:e.r*2.4, life:0.35, ml:0.35, c:e.color});
      dots(e.x, e.y, '#ffffff', 4, 90, 5, 0.3);
    }
    if (e.warped){
      e.wt += dt;
      if (e.type !== 'boss' && Math.random() < 0.75){
        const tur = e.type === 'turret';
        parts.push({k:'dot', x:e.x + rand(-4,4), y:e.y - (tur ? 0 : e.r*1.5), h:tur ? -8 : 0, vh:tur ? -70 : 0, vx:rand(-10,10), vy:tur ? rand(-10,10) : -rand(30,70), life:0.3, max:0.3, c:e.color, s:rand(3,5)});
      }
    }
    switch(e.type){
      case 'drone': e.y += e.vy*dt; e.x += e.vx*dt; if (e.x < e.r || e.x > W-e.r) e.vx *= -1; if (stage >= 45 && !e.shot && e.y > 120){ e.shot = true; aimShot(e, 170, 1, 0); } break;
      case 'spinner': e.y += e.vy*dt; e.x = e.x0 + Math.sin(e.t*e.freq)*e.amp; break;
      case 'tank':
        e.y += e.vy*dt;
        if (e.elite || stage >= 30){
          e.fire = (e.fire ?? 1.5) - dt;
          if (e.fire <= 0 && e.y > 40){
            if (e.elite){ e.fire = 2.4; for (let i=0;i<12;i++){ const a = e.t + i/12*Math.PI*2; eb.push({x:e.x, y:e.y, vx:Math.cos(a)*115, vy:Math.sin(a)*115, r:7, c:'#ffd400'}); } }
            else { e.fire = 3; aimShot(e, 150, 1, 0); }

        }

      case 'turret':

        else {

          if (e.fire <= 0){ e.fire = Math.max(0.9, 1.8 - level*0.08); aimShot(e, 150+level*6, level>=4?3:1, 0.28); e.recoil = 1; }

        }
        break;
      case 'boss': updateBoss(e, dt); break;
    }
  }
  for (const b of eb){ b.x += b.vx*dt; b.y += b.vy*dt; }
  eb = eb.filter(b => b.y > -60 && b.y < H+30 && b.x > -30 && b.x < W+30);

  for (const it of items){
    it.t += dt; it.y += it.vy*dt; it.x += Math.sin(it.t*3)*30*dt;

  }

  for (const b of pb){
    for (const e of en){
      if (e.dead || (e.type==='boss' && warnT > 0) || e.y < -e.r) continue;
      const dx = b.x-e.x, dy = b.y-e.y;
      if (dx*dx + dy*dy < (e.r+5)*(e.r+5)){

        if (e.hp <= 0) kill(e); else if (Math.random() < 0.2) sfx.hit();
        break;
      }
    }
  }
  pb = pb.filter(b => !b.dead);

  for (const p of players){
    if (!p.alive || state !== 'play') continue;
    for (const b of eb){
      if (b.dead) continue;
      const dx = b.x-p.x, dy = b.y-p.y;
      if (p.shield > 0 && dx*dx+dy*dy < 34*34){ b.dead = true; sparks(b.x,b.y,'#00e5ff',4,140,1.8); continue; }
      if (dx*dx+dy*dy < (b.r*0.75+6)*(b.r*0.75+6)){ b.dead = true; hurt(p); break; }
    }
    if (!p.alive || state !== 'play') continue;
    for (const e of en){
      if (e.dead) continue;
      const dx = e.x-p.x, dy = e.y-p.y, rr = e.r*0.8 + (p.shield>0 ? 26 : 9);
      if (dx*dx+dy*dy < rr*rr){

        else { hurt(p); if (e.type!=='boss' && !e.dead){ e.hp -= 3; if (e.hp<=0) kill(e); } break; }
      }
    }
  }

  for (const e of en) if (e.dead || e.y >= H+70) stageResolved++;

function syncEnemies(list){
  const alive = new Set(list);
  for (const ch of [...enemyRoot.children]) if (!alive.has(ch.userData.e)) enemyRoot.remove(ch);
  for (const e of list){
    if (!e.obj){ e.obj = makeEnemyObj(e); e.obj.userData.e = e; }
    if (!e.obj.parent) enemyRoot.add(e.obj);
    const o = e.obj, u = o.userData, X = LX(e.x), Z = LZ(e.y), Y = FLY + Math.sin(e.t*2.2)*0.25, r3 = e.r/10*VIS[e.type];
    o.position.set(X, Y, Z);
    const lm = e.flash > 0 ? WHITE_EDGE : edgeMat(e.color);
    for (const l of u.lines) l.material = lm;
    // 워프 등장 + 피격 반동
    const wt = e.type==='boss' ? 1 : (e.warped ? Math.min(1, e.wt/0.35) : 0);
    u.inner.scale.setScalar((wt <= 0 ? 0.001 : easeOutBack(wt)) * (1 + (e.punch||0)*0.18));
    if (wt <= 0) continue;
    const tgt = nearest(e.x, e.y), c = e.color, vs = VIS[e.type];
    switch(e.type){
      case 'drone': {
        o.rotation.y = Math.atan2(e.vx, e.vy) * 0.8;
        u.inner.rotation.z = -clamp(e.vx/60, -1, 1)*0.45 + Math.sin(e.t*3)*0.12;
        u.inner.rotation.x = Math.sin(e.t*2.3)*0.08;
        GL(e.x, e.y - e.r*vs*1.15, Y, r3*1.3, c, 0.95); GL(e.x, e.y - e.r*vs*1.1, Y, r3*0.4, '#ffffff', 0.9);
        GL(e.x, e.y + e.r*vs*0.62, Y + 0.15*r3, r3*0.45, '#ffffff', 0.35);
        break;
      }
      case 'spinner':
        u.spin.rotation.y = e.t*9; u.hub.rotation.y = -e.t*4;
        u.inner.rotation.x = Math.sin(e.t*2)*0.35; u.inner.rotation.z = Math.cos(e.t*1.7)*0.3;
        G(X, Y + 0.2*r3, Z, r3*1.3, c, 0.9);
        break;
      case 'turret': {
        const a = Math.atan2(tgt.y-e.y, tgt.x-e.x); u.pivot.rotation.y = -a;
        for (const b of u.barrels) b.position.x = -(e.recoil||0)*0.28;
        u.ant.visible = Math.sin(e.t*7) > 0;
        for (const ta of u.thr) GL(e.x + Math.cos(ta)*0.62*e.r*vs, e.y + Math.sin(ta)*0.62*e.r*vs, Y - 0.75*r3, r3*0.9, c, 0.85);
        const charge = !e.leaving && e.y >= e.stopY && e.fire < 0.45 ? 1 - e.fire/0.45 : 0;
        if (charge > 0) for (const s of [-1,1]){
          const tx = e.x + Math.cos(a)*e.r*vs*1.27 - Math.sin(a)*s*0.17*e.r*vs, ty = e.y + Math.sin(a)*e.r*vs*1.27 + Math.cos(a)*s*0.17*e.r*vs;
          GL(tx, ty, Y + 0.4*r3, 0.6 + charge*2.4, c, 0.5 + charge*0.5);
        }
        if (e.recoil > 0.6) GL(e.x + Math.cos(a)*e.r*vs*1.45, e.y + Math.sin(a)*e.r*vs*1.45, Y + 0.4*r3, 3, '#ffffff', e.recoil);
        break;
      }
      case 'tank': {
        const shown = Math.max(0, Math.ceil(e.hp / e.maxhp * 8));
        while (u.shown > shown){
          u.shown--; const p = u.plateList[u.shown]; p.visible = false;
          shatter(e.x, e.y, c, 4, 160, 1.1); sparks(e.x, e.y, '#ffffff', 6, 220, 2); sfx.hit();
        }
        u.plates.rotation.y = e.t*0.7; u.plates.rotation.x = e.t*0.3;
        u.cage.rotation.y = -e.t*1.3; u.cage.rotation.z = e.t*0.6;
        const exposed = 1 - u.shown/8, pulse = 1 + Math.sin(e.t*(4 + exposed*10))*0.1;
        u.core.scale.setScalar(pulse * (1 + exposed*0.15));
        G(X, Y, Z, r3*(2 + exposed*1.6)*pulse, c, 0.6 + exposed*0.4); G(X, Y, Z, r3*0.8, '#ffffff', 0.5 + exposed*0.4);
        break;
      }
      case 'boss': {
        const rage = e.hp < e.maxhp/2, pulse = 1 + Math.sin(e.t*(rage?12:5))*0.15;
        u.ring.rotation.y = e.t*(rage?1.6:0.8); u.ring.rotation.z = Math.sin(e.t*0.7)*0.15;
        u.ring2.visible = rage; u.ring2.rotation.y = -e.t*2.2; u.ring2.rotation.x = Math.PI/2 + Math.sin(e.t*1.3)*0.35;
        o.rotation.z = Math.sin(e.t*0.9)*0.06; o.rotation.x = 0.15;
        u.ringMesh.material = basicMat(c); u.core.material = e.flash > 0 ? basicMat('#ffffff', 2.5) : basicMat(c, 2.2);
        u.core.scale.setScalar(pulse);
        u.lights.forEach((l, i) => l.material = basicMat(rage ? '#ff1744' : '#ffd400', ((Math.floor(e.t*(rage?14:7)) + i) % 6) < 3 ? 2.6 : 0.4));
        u.pods.forEach((pod, i) => { const s = i ? 1 : -1, px = e.x + s*e.r*2.15; pod.rotation.y = Math.atan2(tgt.x - px, tgt.y - e.y) * 0.8; });
        G(X, Y + 3.6*r3/5.8*1.2, Z - 0.4, 7*pulse, c, 0.8);
        for (const s of [-1,1]) GL(e.x + s*e.r*2.15, e.y + e.r*0.75, Y + 1, 2.2, '#ffb000', 0.7 + Math.sin(e.t*8)*0.3);
        for (let i=0;i<4;i++){ const a = i/4*Math.PI*2 + Math.PI/4; GL(e.x + Math.cos(a)*e.r*0.7, e.y + Math.sin(a)*e.r*0.55, Y - 2.2, 3, c, 0.6); }
        if (rage && Math.random() < 0.3) sparks(e.x + rand(-e.r, e.r), e.y + rand(-e.r*0.5, e.r*0.5), '#ff1744', 1, 120, 2);
        break;
      }
    }
  }
}

    dummy.position.set(LX(d.x), FLY + d.h/10, LZ(d.y)); dummy.rotation.set(d.rx, d.ry, 0); dummy.scale.setScalar(d.s*(0.4 + a*0.6)); dummy.updateMatrix();

  }
  // 링
  ringPool.forEach((m, i) => {
    const r = rings[i];
    if (!r || inTitle){ m.visible = false; return; }
    m.visible = true; m.position.set(LX(r.x), FLY, LZ(r.y)); m.scale.setScalar(Math.max(0.01, r.r/10));

  if (inTitle){ camera.position.x += Math.sin(bgT*0.4)*2.5; }
  camera.lookAt(0, 0, 1.5);
  composer.render();
}

  txt('M 전체 소리 · B 배경음악 · Esc 게임 목록', W/2, 724, 11, 'rgba(205,246,255,.6)', 'center', null, 700);
  const bs = [best[1] && `SOLO ${best[1].toLocaleString()}`, best[2] && `DUO ${best[2].toLocaleString()}`].filter(Boolean).join('    ');
  if (bs) txt('HI-SCORE  ' + bs, W/2, 750, 13, '#ffd400', 'center', '#ff7a00');
  txt(`진행  SOLO ${Math.min(80, unlocked[1]-1)}/80  ·  DUO ${Math.min(80, unlocked[2]-1)}/80`, W/2, 772, 11, 'rgba(205,246,255,.7)', 'center', null, 700);
}
function drawOverlay(title, tcol, lines){
  ctx.fillStyle = 'rgba(5,4,16,.62)'; ctx.fillRect(0,0,W,H);
  txt(title, W/2, 280, 46, tcol, 'center', tcol);
  lines.forEach((l,i) => txt(l[0], W/2, 360 + i*44, l[1]||20, l[2]||'#fff', 'center', l[3]||null));
}
function drawSelect(){
  ctx.fillStyle = 'rgba(5,4,16,.74)'; ctx.fillRect(0,0,W,H);
  txt('STAGE SELECT', W/2, 46, 26, '#ffffff', 'center', '#00e5ff');
  const done = Math.min(80, unlocked[mode]-1);
  txt(`${mode===2 ? '2인 협동' : '1인 플레이'}  ·  진행 ${done}/80`, W/2, 76, 12, mode===2 ? '#7ff4ff' : '#ff8fc0', 'center', null, 700);
  const mx = Math.min(80, unlocked[mode]);
  for (let s=0; s<8; s++){
    const y = SEL.y0 + s*SEL.rowH, sc = SECTORS[s], rowOpen = s*10+1 <= mx;
    txt(`SECTOR ${s+1}  ${rowOpen ? sc.name : '???'}`, SEL.x0, y+4, 11, rowOpen ? sc.grid : 'rgba(255,255,255,.3)', 'left', null, 700);
    for (let c=0; c<10; c++){
      const n = s*10 + c + 1, x = SEL.x0 + c*(SEL.cw+SEL.gap), cy = y + 14;
      const open = n <= mx, cleared = n < unlocked[mode], boss = c === 9, elite = c === 4, cur = n === sel;
      if (cur) additive(() => glow(x+SEL.cw/2, cy+SEL.cw/2, 32, sc.grid, 0.45 + Math.sin(bgT*5)*0.15));
      ctx.fillStyle = cleared ? hexA(sc.grid, 0.3) : open ? 'rgba(10,8,30,.9)' : 'rgba(255,255,255,.04)'; rrect(x, cy, SEL.cw, SEL.cw, 7);
      ctx.strokeStyle = open ? hexA(sc.grid, cur ? 1 : 0.55) : 'rgba(255,255,255,.1)'; ctx.lineWidth = cur ? 2.5 : 1;
      ctx.beginPath(); ctx.roundRect(x+0.5, cy+0.5, SEL.cw-1, SEL.cw-1, 7); ctx.stroke();
      const label = !open ? '·' : boss ? '★' : String(n);
      txt(label, x+SEL.cw/2, cy+SEL.cw/2+1, boss ? 17 : 12, !open ? 'rgba(255,255,255,.3)' : boss ? '#ffd400' : elite ? '#ffe9a0' : '#ffffff', 'center', null, 700);
      if (cleared && !boss){ ctx.fillStyle = '#7cff4f'; circle(x+SEL.cw-6, cy+6, 2.5); }
    }
  }
  const ss = SECTORS[sectorOf(sel)], tag = sel === 80 ? ' · FINAL BOSS' : sel%10 === 0 ? ' · BOSS' : sel%10 === 5 ? ' · ELITE' : '';
  drawBtn(SBTN.go, `STAGE ${sel} 출격`, ss.name + tag, ss.grid, 0);
  hudBox(SBTN.back.x, SBTN.back.y, SBTN.back.w, SBTN.back.h, '#00e5ff'); txt('뒤로', W/2, SBTN.back.y + SBTN.back.h/2, 15, '#cdf6ff');
  txt('방향키 선택 · Enter 출격 · Esc 뒤로 · 칸을 두 번 탭해도 출격', W/2, 736, 10, 'rgba(205,246,255,.6)', 'center', null, 700);
}
function drawStageBanner(){
  const sc = SECTORS[sectorOf(stage)], local = (stage-1)%10 + 1;
  if (stagePhase === 'intro'){
    const a = Math.max(0, Math.min(1, phaseT*3, (2.2-phaseT)*3));
    ctx.globalAlpha = a;
    const wline = W*0.7*Math.min(1, phaseT*2.5);
    ctx.fillStyle = hexA(sc.grid, 0.8); ctx.fillRect(W/2 - wline/2, H/2-92, wline, 2); ctx.fillRect(W/2 - wline/2, H/2+34, wline, 2);
    txt(`SECTOR ${sectorOf(stage)+1}  ·  ${sc.name}`, W/2, H/2-72, local === 1 ? 16 : 13, sc.grid, 'center', sc.grid, 700);
    txt(`STAGE ${stage}`, W/2, H/2-30, 48, '#ffffff', 'center', sc.grid);
    if (local === 10) txt(stage === 80 ? '⚠ FINAL BOSS ⚠' : '⚠ BOSS STAGE', W/2, H/2+14, 16, '#ff3864', 'center', '#ff1744');
    else if (local === 5) txt('ELITE STAGE', W/2, H/2+14, 15, '#ffd400', 'center', '#ff7a00');
    else txt('READY', W/2, H/2+14, 14, '#cdf6ff', 'center', null, 700);
    ctx.globalAlpha = 1;
  } else if (stagePhase === 'clear' && clearInfo){
    const a = Math.max(0, Math.min(1, phaseT*3, (3.4-phaseT)*3));
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(5,4,16,.45)'; ctx.fillRect(0, H/2-110, W, 190);
    txt('STAGE CLEAR', W/2, H/2-70, 40, '#7cff4f', 'center', '#7cff4f');
    let y = H/2-22;
    txt(`클리어 보너스  +${clearInfo.bonus.toLocaleString()}`, W/2, y, 15, '#ffffff', 'center', null, 700); y += 26;
    if (clearInfo.nd) { txt(`노데미지 보너스  +${clearInfo.nd.toLocaleString()}`, W/2, y, 15, '#ffd400', 'center', '#ff7a00', 700); y += 26; }
    if (clearInfo.boss) { txt('생명 +1 · 쓰러진 동료 부활', W/2, y, 14, '#ff8fc0', 'center', null, 700); y += 26; }
    if (stage < 80 && stage % 10 === 0) txt(`NEXT ▶ SECTOR ${sectorOf(stage+1)+1} · ${SECTORS[sectorOf(stage+1)].name}`, W/2, y+4, 12, SECTORS[sectorOf(stage+1)].grid, 'center', null, 700);
    ctx.globalAlpha = 1;
  }
}
function drawUI(){
  ctx.setTransform(scale*dpr, 0, 0, scale*dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(vignette, 0, 0);
  for (const t of texts){ const s = toScreen(t.x, t.y, FLY + 1.5); ctx.globalAlpha = Math.min(1, t.life/t.max*2); txt(t.s, s.x, s.y, t.size, t.c, 'center', t.c); }
  ctx.globalAlpha = 1;
  if (redFlash > 0){ ctx.fillStyle = `rgba(255,23,68,${redFlash*0.35})`; ctx.fillRect(0,0,W,H); }
  if (flash > 0){ ctx.fillStyle = `rgba(255,255,255,${flash*0.7})`; ctx.fillRect(0,0,W,H); }
  if (state === 'title') drawTitle();
  if (state === 'select') drawSelect();
  if (state === 'play' || state === 'pause') drawStageBanner();
  if (state === 'play' && warnT > 0) drawWarning();
  if (state === 'play' || state === 'pause') drawHUD();
  if (state === 'play' && mode === 2 && time < 4){
    const a = Math.min(1, 4 - time);
    ctx.globalAlpha = a * 0.5; ctx.strokeStyle = '#ffffff'; ctx.setLineDash([6,10]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(W/2, 100); ctx.lineTo(W/2, H-90); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = a;
    txt('◀ 1P 터치', W/4, H/2, 14, '#ff8fc0', 'center', '#ff2e88'); txt('2P 터치 ▶', W*3/4, H/2, 14, '#7ff4ff', 'center', '#00e5ff');
    ctx.globalAlpha = 1;
  }
  if (state === 'pause') drawOverlay('PAUSE', '#00e5ff', [['탭하거나 P를 눌러 계속', 16]]);
  if (state === 'over'){
    const lines = [
      [(mode === 2 ? 'TEAM ' : 'SCORE ') + score.toLocaleString(), 28, '#ffffff', '#00e5ff'],
      [newBest ? '★ NEW RECORD ★' : `BEST ` + best[mode].toLocaleString(), 18, newBest ? '#7cff4f' : '#ffd400', newBest ? '#7cff4f' : null],
      [`STAGE ${stage} · ${SECTORS[sectorOf(stage)].name}`, 15, SECTORS[sectorOf(stage)].grid],
    ];
    if (overT > 0.9 && Math.floor(overT*2.5) % 2 === 0) lines.push([`탭해서 STAGE ${stage} 다시 도전`, 17, '#ffffff', '#ff2e88']);
    drawOverlay('GAME OVER', '#ff2e88', lines);
    if (overT > 0.9){
      hudBox(BTN.title.x, BTN.title.y, BTN.title.w, BTN.title.h, '#00e5ff');
      txt('스테이지 선택', W/2, BTN.title.y + BTN.title.h/2, 15, '#cdf6ff');
    }
  }
  if (state === 'allclear'){
    ctx.fillStyle = 'rgba(5,4,16,.45)'; ctx.fillRect(0,0,W,H);
    txt('ALL CLEAR!', W/2, 230, 50, '#ffd400', 'center', '#ff7a00');
    txt('80 스테이지 정복 · 은하에 평화가 찾아왔다', W/2, 285, 15, '#ffffff', 'center', '#b44dff', 700);
    txt((mode === 2 ? 'TEAM ' : 'SCORE ') + score.toLocaleString(), W/2, 360, 30, '#ffffff', 'center', '#00e5ff');
    txt(newBest ? '★ NEW RECORD ★' : 'BEST ' + best[mode].toLocaleString(), W/2, 405, 18, newBest ? '#7cff4f' : '#ffd400', 'center', newBest ? '#7cff4f' : null);
    if (overT > 1.5 && Math.floor(overT*2.5) % 2 === 0) txt('탭해서 계속', W/2, 480, 17, '#ffffff', 'center', '#ff2e88');
  }
  drawButtons();
  cv.style.cursor = state === 'play' && stagePhase === 'fight' ? 'none' : 'pointer';
}

reset();
document.getElementById('loading').remove();
let last = performance.now();
function loop(now){
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); render3D(); drawUI(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
</body>
</html>
