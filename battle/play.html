<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 배틀게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#07060c;color:#fff;font-family:"Noto Sans KR",system-ui,sans-serif}
.hf{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:.5px}
#scene{position:fixed;inset:0;z-index:0;transition:filter 1.2s}
#scene.dead{filter:grayscale(.9) brightness(.6)}
#scene canvas{display:block}
#vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6) 100%)}
#vig.low{animation:low 1s infinite}
@keyframes low{50%{box-shadow:inset 0 0 120px rgba(255,0,0,.55)}}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .4s;z-index:3}
.top,.bottom{position:fixed;left:0;right:0;z-index:2;max-width:820px;margin:0 auto;padding:12px}
.top{top:0}.bottom{bottom:0}
.glass{background:linear-gradient(180deg,rgba(34,28,54,.85),rgba(12,10,22,.85));border:1px solid rgba(255,210,120,.38);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.45);backdrop-filter:blur(6px)}
.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.logo{font-size:26px;background:linear-gradient(180deg,#fff6d0,#f2b544 55%,#b9751a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 3px rgba(0,0,0,.8))}
#place{font-size:14px;margin-left:10px;color:#f5e6c0;text-shadow:0 1px 4px #000}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{padding:10px 14px}
.name{font-size:18px;display:flex;align-items:baseline;gap:8px}
.st{font-size:12px;opacity:.75;font-family:"Noto Sans KR",sans-serif}
.lbl{font-size:12px;display:flex;justify-content:space-between;margin-top:6px;color:#e8e0d0}
.bar{position:relative;height:13px;border-radius:7px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);overflow:hidden;margin-top:3px}
.bar>div{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.ghost{background:#fff6e0;opacity:.85;transition:width .7s ease .3s}
.fill{transition:width .25s}
.fill::after{content:"";position:absolute;left:0;right:0;top:0;height:45%;background:rgba(255,255,255,.28);border-radius:7px}
.hp{background:linear-gradient(90deg,#0f9b7a,#45f0a0)}.mp{background:linear-gradient(90deg,#2a5bd7,#5cc8ff)}.ehp{background:linear-gradient(90deg,#8e0e00,#ff4b2b)}
#eint.warn{color:#ff7070;animation:blink .5s infinite}
@keyframes blink{50%{opacity:.4}}
.banner{display:none;text-align:center;font-size:24px;padding:14px;margin-top:10px}
#log{padding:8px 14px;margin-bottom:8px;min-height:70px}
#log div{font-size:13px;line-height:1.65;opacity:.55}
#log div:first-child{opacity:1;color:#fff3cf}
#msg{font-size:13px;color:#ff9b9b;min-height:18px;text-shadow:0 1px 3px #000}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.acts{grid-template-columns:1fr 1fr}.logo{font-size:20px}.name{font-size:15px}}
button{font:inherit;color:#fff;cursor:pointer}
.b{--c:#f2b544;position:relative;padding:12px 8px;border-radius:12px;border:1px solid var(--c);background:linear-gradient(180deg,rgba(40,34,62,.92),rgba(14,12,26,.92));box-shadow:inset 0 0 14px rgba(0,0,0,.6);transition:box-shadow .15s,transform .1s}
.b:hover{box-shadow:inset 0 0 14px rgba(0,0,0,.6),0 0 18px var(--c)}
.b:active{transform:scale(.96)}
.b .hf{font-size:19px;display:block;color:var(--c);text-shadow:0 0 8px rgba(0,0,0,.9)}
.b .st{display:block;margin-top:2px}
.small{font-size:13px;padding:7px 12px;border-radius:10px;border:1px solid rgba(255,210,120,.45);background:rgba(20,16,32,.8)}
.dmg{position:fixed;z-index:4;pointer-events:none;font-family:"Black Han Sans",sans-serif;font-size:42px;-webkit-text-stroke:2px #000;paint-order:stroke fill;transform:translate(-50%,-50%);animation:up 1.1s ease-out forwards}
.dmg.crit{font-size:60px;color:#ffd84a;animation:crit 1.2s ease-out forwards}
@keyframes up{0%{transform:translate(-50%,-30%) scale(.6)}15%{transform:translate(-50%,-50%) scale(1.15)}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}
@keyframes crit{0%{transform:translate(-50%,-50%) scale(2.4) rotate(-8deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1) rotate(-4deg);opacity:1}100%{transform:translate(-50%,-170%) rotate(-4deg);opacity:0}}
#intro{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0}
#intro.go{animation:intro 2s ease forwards}
#intro .s1{font-size:22px;letter-spacing:8px;color:#f5e6c0}
#intro .s2{font-size:64px;background:linear-gradient(180deg,#fff6d0,#f2b544 55%,#b9751a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 6px rgba(0,0,0,.9))}
#intro .s3{font-size:28px;color:#ff6a5a;text-shadow:0 2px 6px #000}
#intro .line{width:0;height:2px;background:linear-gradient(90deg,transparent,#f2b544,transparent);margin:10px 0}
#intro.go .line{animation:line 2s ease forwards}
@keyframes intro{0%{opacity:0;transform:scale(1.4)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(.95)}}
@keyframes line{to{width:60%}}
@media (max-width:560px){#intro .s2{font-size:42px}}
#err{display:none;position:fixed;inset:0;z-index:6;align-items:center;justify-content:center;text-align:center;padding:24px}
</style>
</head>
<body>
<div id="scene"></div>
<div id="vig"></div>
<div id="fade"></div>
<div id="intro"><div class="s1 hf" id="i1"></div><div class="line"></div><div class="s2 hf" id="i2"></div><div class="line"></div><div class="s3 hf" id="i3"></div></div>
<div class="top">
  <div class="title"><div><span class="logo hf">용사의 전설</span><span id="place"></span></div><button class="small" onclick="reset()">↻ 처음부터</button></div>
  <div class="cards">
    <div class="card glass">
      <div class="name hf">🗡️ 용사 <span class="st" id="pst">Lv.1</span></div>
      <div class="lbl"><span>HP</span><span id="php"></span></div><div class="bar"><div class="ghost" id="phpg"></div><div class="fill hp" id="phpb"></div></div>
      <div class="lbl"><span>MP</span><span id="pmp"></span></div><div class="bar"><div class="fill mp" id="pmpb"></div></div>
    </div>
    <div class="card glass">
      <div class="name hf"><span id="en"></span><span class="st" id="est"></span></div>
      <div class="lbl"><span>HP</span><span id="ehp"></span></div><div class="bar"><div class="ghost" id="ehpg"></div><div class="fill ehp" id="ehpb"></div></div>
      <div class="lbl"><span>다음 행동</span><b id="eint"></b></div>
    </div>
  </div>
  <div class="banner glass hf" id="banner"></div>
</div>
<div class="bottom">
  <div id="log" class="glass"></div>
  <div id="msg"></div>
  <div class="acts">
    <button class="b" style="--c:#f2d27a" onclick="act('atk')"><span class="hf">⚔️ 공격</span><span class="st">MP +2</span></button>
    <button class="b" style="--c:#ff8a3d" onclick="act('skill')"><span class="hf">🔥 화염베기</span><span class="st">MP 8</span></button>
    <button class="b" style="--c:#5cf0a0" onclick="act('heal')"><span class="hf">💚 회복</span><span class="st">MP 6</span></button>
    <button class="b" style="--c:#6cc8ff" onclick="act('def')"><span class="hf">🛡️ 방어</span><span class="st">MP +4</span></button>
  </div>
</div>
<div id="err" class="glass">3D 화면을 불러오지 못했어요. 브라우저에서 WebGL이 켜져 있는지 확인해 주세요.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
const $=id=>document.getElementById(id);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
let seed=1;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
let bloom,renderer,composer,scene,camera,hemi,sun,rim,env,hero,monster,shield,shieldW,aura;
const fx=[];
try{
renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
$('scene').appendChild(renderer.domElement);
}catch(err){$('err').style.display='flex';}
scene=new THREE.Scene();
camera=new THREE.PerspectiveCamera(50,1,.1,300);
hemi=new THREE.HemisphereLight(0xffffff,0x444444,.8);scene.add(hemi);
sun=new THREE.DirectionalLight(0xffffff,1);sun.position.set(6,12,8);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:-10,near:1,far:40});
scene.add(sun);
rim=new THREE.DirectionalLight(0x9fb8ff,.7);rim.position.set(-4,6,-10);scene.add(rim);
try{if(renderer&&THREE.EffectComposer&&THREE.UnrealBloomPass&&THREE.ShaderPass){composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,camera));bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.8,.45,.85);composer.addPass(bloom);}}catch(err){composer=null;}

const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,flatShading:true,roughness:.8},o||{}));
const Cyl=(a,b,h,s)=>new THREE.CylinderGeometry(a,b,h,s||8);
function mk(geo,mat,x,y,z){const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);m.castShadow=true;m.receiveShadow=true;return m;}

function eyes(g,x,y,z,sp,r,col,glow){[-1,1].forEach(s=>g.add(mk(new THREE.SphereGeometry(r,10,8),S(col,glow?{emissive:col,emissiveIntensity:2}:{roughness:.2}),x,y,z+s*sp)));}
const S=(c,o)=>{const m=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.5},o||{}));if(m.metalness>.45){m.metalness=.45;m.roughness=Math.max(m.roughness,.38);}return m;};
const G=(c,i)=>S(c,{emissive:c,emissiveIntensity:i||2});
function bone(g,a,b,r,mat){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A),m=mk(new THREE.CylinderGeometry(r*.6,r,d.length(),8),mat);m.position.copy(A).add(B).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());g.add(m);return m;}
function half(r,mat,x,y,z){return mk(new THREE.SphereGeometry(r,20,12,0,Math.PI*2,0,Math.PI/2),mat,x,y,z);}

function makeHero(){
  const g=new THREE.Group(),body=new THREE.Group();g.add(body);
  const steel=S(0xd8dee8,{metalness:.85,roughness:.25}),dark=S(0x394050,{metalness:.7,roughness:.35}),gold=S(0xf0c050,{metalness:.95,roughness:.25});
  const cloth=S(0x1d4fc4,{roughness:.85,side:THREE.DoubleSide}),red=S(0xc0221a,{roughness:.8,side:THREE.DoubleSide}),leather=S(0x5a3a22,{roughness:.8}),glow=G(0x6fe6ff,2.4);
  [-1,1].forEach(s=>{
    body.add(mk(new THREE.BoxGeometry(.36,.22,.26),leather,.05,.11,s*.19));
    body.add(mk(new THREE.BoxGeometry(.38,.06,.28),gold,.05,.23,s*.19));
    body.add(mk(Cyl(.12,.11,.55,12),dark,0,.52,s*.19));
    body.add(mk(new THREE.SphereGeometry(.13,14,10),steel,.03,.78,s*.19));
  });
  body.add(mk(new THREE.CylinderGeometry(.42,.58,.48,20,1,true),cloth,0,.92,0));
  const belt=mk(new THREE.TorusGeometry(.44,.06,8,28),leather,0,1.12,0);belt.rotation.x=Math.PI/2;body.add(belt);
  body.add(mk(new THREE.BoxGeometry(.08,.16,.2),gold,.46,1.12,0));
  body.add(mk(new THREE.CylinderGeometry(.5,.43,.72,20),steel,0,1.48,0));
  body.add(mk(new THREE.BoxGeometry(.05,.62,.4),cloth,.46,1.3,0));
  body.add(mk(new THREE.OctahedronGeometry(.1),G(0xffd060,1.4),.5,1.58,0));
  body.add(mk(new THREE.CylinderGeometry(.25,.33,.16,16),steel,0,1.9,0));
  [-1,1].forEach(s=>{
    const pd=half(.28,steel,0,1.74,s*.56);pd.scale.set(1.1,.85,1);body.add(pd);
    const rim=mk(new THREE.TorusGeometry(.28,.035,6,24),gold,0,1.75,s*.56);rim.rotation.x=Math.PI/2;body.add(rim);
    body.add(mk(Cyl(.1,.09,.55,12),steel,0,1.36,s*.62));
    body.add(mk(new THREE.SphereGeometry(.12,12,10),dark,.04,1.04,s*.63));
  });
  body.add(mk(Cyl(.3,.3,.42,20),steel,0,2.16,0));
  body.add(half(.3,steel,0,2.36,0));
  body.add(mk(new THREE.BoxGeometry(.06,.06,.4),glow,.29,2.18,0));
  body.add(mk(new THREE.BoxGeometry(.06,.24,.07),glow,.29,2.08,0));
  body.add(mk(new THREE.BoxGeometry(.6,.07,.07),gold,0,2.66,0));
  for(let k=0;k<6;k++)body.add(mk(new THREE.SphereGeometry(.12-k*.012,10,8),red,.15-k*.13,2.72-k*k*.025,0));
  const cape=new THREE.Group();cape.position.set(-.42,1.86,0);
  cape.add(mk(new THREE.BoxGeometry(.05,.75,.95),red,0,-.37,0));
  const cape2=new THREE.Group();cape2.position.y=-.74;cape2.add(mk(new THREE.BoxGeometry(.05,.75,.9),red,0,-.37,0));cape.add(cape2);
  body.add(cape);
  const sw=new THREE.Group();sw.position.set(.15,1.05,.66);
  sw.add(mk(Cyl(.04,.04,.28,8),leather,0,-.05,0));
  sw.add(mk(new THREE.SphereGeometry(.065,10,8),gold,0,-.21,0));
  sw.add(mk(new THREE.BoxGeometry(.12,.08,.55),gold,0,.12,0));
  sw.add(mk(new THREE.OctahedronGeometry(.07),G(0x5fb8ff,2),.07,.12,0));
  sw.add(mk(new THREE.BoxGeometry(.05,1.5,.15),steel,0,.92,0));
  sw.add(mk(new THREE.BoxGeometry(.065,1.25,.035),glow,0,.85,0));
  sw.add(mk(new THREE.ConeGeometry(.08,.22,4),steel,0,1.78,0));
  sw.rotation.z=-.3;g.add(sw);
  const sh=new THREE.Group();sh.position.set(.3,1.32,-.7);
  const disc=mk(Cyl(.42,.42,.07,28),steel,0,0,0);disc.rotation.z=Math.PI/2;sh.add(disc);
  const sr=mk(new THREE.TorusGeometry(.42,.04,8,32),gold,0,0,0);sr.rotation.y=Math.PI/2;sh.add(sr);
  sh.add(mk(new THREE.BoxGeometry(.02,.62,.12),cloth,.04,0,0));sh.add(mk(new THREE.BoxGeometry(.02,.12,.62),cloth,.04,0,0));
  sh.add(mk(new THREE.SphereGeometry(.1,12,10),gold,.05,0,0));
  body.add(sh);
  g.userData={bx:-3.2,by:0,dir:1,h:2.8,ph:0,sword:sw,lt:1,sh:0,anim:t=>{cape.rotation.z=-.12-Math.sin(t*2)*.07;cape2.rotation.z=-.1-Math.sin(t*2+1)*.14;cape.rotation.x=Math.sin(t*1.3)*.05;}};
  g.position.x=-3.2;return g;
}

function makeMonster(i){
  const g=new THREE.Group();let h=2,bx=3.2;const u={};
  if(i===0){
    const blob=new THREE.Group();g.add(blob);
    const b=mk(new THREE.SphereGeometry(1,40,28),S(0x3fe060,{transparent:true,opacity:.78,roughness:.08,metalness:.1}),0,.82,0);b.scale.y=.82;blob.add(b);
    blob.add(mk(new THREE.SphereGeometry(.36,20,16),G(0xa8ff70,2.2),.15,.75,0));
    [[.3,.45,.4,.08],[.45,1,-.35,.06],[-.1,.35,-.5,.07],[.5,.6,.1,.05]].forEach(q=>blob.add(mk(new THREE.SphereGeometry(q[3],10,8),S(0xeaffea,{transparent:true,opacity:.6}),q[0],q[1],q[2])));
    blob.add(mk(new THREE.SphereGeometry(.2,14,10),S(0xffffff,{transparent:true,opacity:.55,roughness:0}),-.35,1.3,.35));
    [-1,1].forEach(s=>{blob.add(mk(new THREE.SphereGeometry(.22,18,14),S(0xffffff,{roughness:.2}),-.8,1.02,s*.34));
      blob.add(mk(new THREE.SphereGeometry(.12,14,10),S(0x111111,{roughness:.1}),-.98,1.02,s*.34));
      blob.add(mk(new THREE.SphereGeometry(.04,8,6),G(0xffffff,1.5),-1.08,1.07,s*.3));
      blob.add(mk(new THREE.SphereGeometry(.09,10,8),S(0xff8aa0,{transparent:true,opacity:.6}),-.85,.8,s*.55));});
    const mo=mk(new THREE.TorusGeometry(.18,.035,8,20,Math.PI),S(0x113311),-.95,.78,0);mo.rotation.set(0,Math.PI/2,Math.PI);blob.add(mo);
    const crown=new THREE.Group();crown.position.set(0,1.5,0);crown.rotation.z=.15;
    const gold=S(0xf2c24a,{metalness:.95,roughness:.25});
    crown.add(mk(new THREE.CylinderGeometry(.4,.44,.22,16,1,true),S(0xf2c24a,{metalness:.95,roughness:.25,side:THREE.DoubleSide})));
    for(let k=0;k<8;k++){const a=k/8*Math.PI*2;crown.add(mk(new THREE.ConeGeometry(.08,.28,6),gold,Math.cos(a)*.4,.24,Math.sin(a)*.4));
      if(k%2===0)crown.add(mk(new THREE.OctahedronGeometry(.06),G(k%4?0x40a0ff:0xff3050,1.6),Math.cos(a)*.43,0,Math.sin(a)*.43));}
    blob.add(crown);
    u.anim=t=>{const s=Math.sin(t*3);blob.scale.set(1-s*.04,1+s*.07,1-s*.04);};h=2.1;
  }
  if(i===1){
    const leather=S(0x4a3a2a,{roughness:.8}),cloak=S(0x1c3a26,{roughness:.9,side:THREE.DoubleSide}),skin=S(0x86c255,{roughness:.6}),poison=G(0x7dff5a,2.2);
    [-1,1].forEach(s=>{g.add(mk(Cyl(.1,.09,.55,10),leather,0,.32,s*.18));g.add(mk(new THREE.BoxGeometry(.3,.14,.2),S(0x2a1f16),-.05,.07,s*.18));});
    g.add(mk(Cyl(.28,.38,.8,14),leather,0,1,0));
    const cl=mk(new THREE.ConeGeometry(.66,1.45,18,1,true),cloak,0,1.15,0);g.add(cl);
    const sc=mk(new THREE.TorusGeometry(.3,.08,8,20),S(0xa01818,{roughness:.8}),0,1.55,0);sc.rotation.x=Math.PI/2;g.add(sc);
    g.add(mk(new THREE.SphereGeometry(.34,18,14),skin,-.05,1.86,0));
    const hood=mk(new THREE.SphereGeometry(.46,20,14,Math.PI*.15,Math.PI*1.7),cloak,0,1.9,0);hood.rotation.y=-Math.PI/2;g.add(hood);
    {const tp=mk(new THREE.ConeGeometry(.2,.5,10),cloak,.32,2.15,0);tp.rotation.z=-1;g.add(tp);}
    [-1,1].forEach(s=>{const e=mk(new THREE.ConeGeometry(.1,.55,8),skin,-.05,1.92,s*.55);e.rotation.x=s*1.25;g.add(e);});
    eyes(g,-.36,1.9,0,.13,.06,0xffe030,true);
    const ds=[-1,1].map(s=>{const d=new THREE.Group();d.position.set(-.3,1.1,s*.52);
      d.add(mk(Cyl(.035,.035,.22,8),S(0x2a1f16),0,0,0));d.add(mk(new THREE.BoxGeometry(.06,.05,.2),S(0xb0b8c0,{metalness:.8,roughness:.3}),0,.12,0));
      d.add(mk(new THREE.BoxGeometry(.03,.55,.08),poison,0,.42,0));d.rotation.z=.9;g.add(d);return d;});
    u.anim=t=>{ds.forEach((d,j)=>d.rotation.z=.9+Math.sin(t*3+j*2)*.15);cl.rotation.y=Math.sin(t*1.5)*.06;};h=2.5;
  }
  if(i===2){
    const skin=S(0x5f8a3a,{roughness:.6}),iron=S(0x6a6e78,{metalness:.8,roughness:.35}),fur=S(0x7a5532,{roughness:1}),lea=S(0x4a3220,{roughness:.8});

shield=new THREE.Group();
shield.add(new THREE.Mesh(new THREE.SphereGeometry(1.6,24,18),new THREE.MeshBasicMaterial({color:0x4aa8ff,transparent:true,opacity:.16,depthWrite:false,blending:THREE.AdditiveBlending})));
shieldW=new THREE.Mesh(new THREE.IcosahedronGeometry(1.68,1),new THREE.MeshBasicMaterial({color:0x9fe0ff,wireframe:true,transparent:true,opacity:.7,blending:THREE.AdditiveBlending}));shield.add(shieldW);
shield.visible=false;scene.add(shield);
aura=new THREE.Mesh(new THREE.SphereGeometry(1,20,16),new THREE.MeshBasicMaterial({color:0xff2a2a,transparent:true,opacity:.12,depthWrite:false,blending:THREE.AdditiveBlending}));aura.visible=false;scene.add(aura);

const pg=new THREE.SphereGeometry(.11,6,6);
const addMat=(c,o)=>new THREE.MeshBasicMaterial(Object.assign({color:c,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending},o||{}));
function burst(pos,col,n,o){o=o||{};for(let k=0;k<n;k++){const m=new THREE.Mesh(pg,addMat(col));m.position.copy(pos);
  if(o.up){m.position.x+=(Math.random()-.5)*1.8;m.position.z+=(Math.random()-.5)*1.8;}
  const sp=o.sp||7;const v=o.up?new THREE.Vector3(0,1.5+Math.random()*2.5,0):new THREE.Vector3((Math.random()-.5)*sp,Math.random()*sp*.8,(Math.random()-.5)*sp);
  m.scale.setScalar(o.size||1);scene.add(m);const L=o.life||(o.up?1.2:.7);fx.push({m,v,life:L,max:L,g:o.up?0:9});}}
function center(t){return new THREE.Vector3(t.position.x,t.userData.h*.55,0);}
function slash(t,col){const m=new THREE.Mesh(new THREE.TorusGeometry(1.3,.08,6,36,Math.PI*1.1),addMat(col,{side:THREE.DoubleSide}));
  m.position.copy(center(t));m.position.z=.6;m.rotation.z=Math.random()*Math.PI*2;scene.add(m);
  fx.push({m,life:.32,max:.32,step:(f)=>{const k=1-f.life/f.max;m.scale.setScalar(.6+k*.9);m.rotation.z+=.25;}});}
function ring(pos,col,maxR,life){const m=new THREE.Mesh(new THREE.TorusGeometry(1,.06,6,48),addMat(col));m.position.copy(pos);m.rotation.x=Math.PI/2;scene.add(m);
  fx.push({m,life:life||.5,max:life||.5,step:(f)=>{const k=1-f.life/f.max;m.scale.setScalar(.3+k*maxR);}});}
function flashLight(pos,col,inten){const l=new THREE.PointLight(col,inten,14);l.position.copy(pos);scene.add(l);fx.push({m:l,life:.4,max:.4,light:inten});}
function fireball(from,to,done){
  const m=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),addMat(0xffc060));
  m.add(new THREE.Mesh(new THREE.SphereGeometry(.6,16,12),addMat(0xff5a10,{opacity:.5})));
  m.add(new THREE.PointLight(0xff7020,3,9));
  const x0=from.position.x+.9,x1=to.position.x;m.position.set(x0,1.6,0);scene.add(m);
  fx.push({m,life:.45,max:.45,step:(f)=>{const k=1-f.life/f.max;m.position.x=x0+(x1-x0)*k;m.position.y=1.6+Math.sin(k*Math.PI)*1.3+(to.userData.h*.55-1.6)*k;m.rotation.y+=.3;
    if(Math.random()<.8)burst(m.position,Math.random()<.5?0xff7a1a:0xffd040,1,{sp:1.5,life:.35,size:1.4});},end:done});}
function flash(t,col){const mats=[];t.traverse(o=>{if(o.isMesh&&o.material.emissive){const mt=o.material;if(mt.userData.e0===undefined){mt.userData.e0=mt.emissive.getHex();mt.userData.i0=mt.emissiveIntensity;}mt.emissive.setHex(col);mt.emissiveIntensity=1;mats.push(mt);}});
  setTimeout(()=>mats.forEach(mt=>{mt.emissive.setHex(mt.userData.e0);mt.emissiveIntensity=mt.userData.i0;}),170);}
function pop(t,text,col,cls){const v=new THREE.Vector3(t.position.x,t.userData.h+.4,0).project(camera);const d=document.createElement('div');d.className='dmg '+(cls||'');d.textContent=text;if(col)d.style.color=col;
  d.style.left=((v.x+1)/2*innerWidth)+'px';d.style.top=((1-v.y)/2*innerHeight)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1250);}
function hit(t,d,crit,col){flash(t,0xff2222);t.userData.sh=.3;burst(center(t),crit?0xffd84a:(col||0xffffff),crit?22:12,{sp:8});
  if(crit)pop(t,'CRITICAL '+d,null,'crit');else pop(t,d,'#ffffff');}
function lunge(t){t.userData.lt=0;}

const cam={x:0,y:4.5,z:12,lx:0,ly:1.6,sh:0};
let focus={x:0,dz:0,lx:0},focusT=0,slowT=0,timeScale=1,victory=false,vAng=0;
function setFocus(x,dz,lx,ms){focus={x,dz,lx};focusT=ms/1000;}

function resize(){const w=innerWidth,h=innerHeight;if(renderer)renderer.setSize(w,h);if(composer)composer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const rdt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(slowT>0){slowT-=rdt;timeScale=.22;}else timeScale+=(1-timeScale)*.15;
  const dt=rdt*timeScale;
  const portrait=camera.aspect<1;
  const zc=portrait?Math.min(22,10/camera.aspect*.85):12;
  focusT-=rdt;const f=focusT>0?focus:{x:0,dz:0,lx:0};
  let tx=Math.sin(t*.25)*1.6+f.x,ty=4.3+(portrait?1.5:0)+f.dz*.18,tz=zc+f.dz,lx=f.lx,ly=1.6;
  if(victory){vAng+=rdt*.45;tx=hero.position.x+Math.sin(vAng)*6.5;tz=Math.cos(vAng)*6.5+1;ty=2.6;lx=hero.position.x;ly=1.5;}
  const ease=focusT>0?.12:.05;
  cam.x+=(tx-cam.x)*ease;cam.y+=(ty-cam.y)*ease;cam.z+=(tz-cam.z)*ease;cam.lx+=(lx-cam.lx)*ease;cam.ly+=(ly-cam.ly)*ease;
  cam.sh*=.88;const s=cam.sh;
  camera.position.set(cam.x+(Math.random()-.5)*s,cam.y+(Math.random()-.5)*s,cam.z);camera.lookAt(cam.lx,cam.ly,0);
  [hero,monster].forEach(c=>{if(!c)return;const u=c.userData;let off=0,sz=0,y=u.by;
    if(u.lt<1){u.lt=Math.min(1,u.lt+dt/.45);const k=Math.sin(Math.PI*u.lt);off=k*1.9*u.dir;if(u.sword)u.sword.rotation.z=-.3-k*1.8;}
    if(u.sh>0){u.sh-=dt;sz=(Math.random()-.5)*.35;}
    if(u.enter!==undefined&&u.enter<1){u.enter=Math.min(1,u.enter+dt/.55);y+=(1-u.enter*u.enter)*9;if(u.enter>=1){cam.sh=.6;ring(new THREE.Vector3(c.position.x,.05,0),0xffe0a0,4,.6);burst(new THREE.Vector3(c.position.x,.2,0),0xd8c8a0,18,{sp:6});}}
    if(u.dying){u.dt=(u.dt||0)+dt;c.rotation.z=u.dir*Math.min(u.dt*2.5,1.45);y-=Math.min(u.dt*.6,.4);}
    else{y+=Math.sin(t*2.2+u.ph)*.06;c.rotation.z=0;}
    if(u.anim&&!u.dying)u.anim(t);
    c.position.set(u.bx+off,y,sz);});
  shield.position.set(hero.position.x,1.3,0);shieldW.rotation.y+=rdt*.8;shieldW.rotation.x+=rdt*.3;shield.scale.setScalar(1+Math.sin(t*6)*.03);
  if(monster){aura.position.set(monster.position.x,monster.userData.h*.5,0);aura.scale.setScalar(monster.userData.h*.5*(1+Math.sin(t*9)*.08));}
  aura.visible=!!(e&&e.charge&&!over);
  for(let k=fx.length-1;k>=0;k--){const q=fx[k];q.life-=dt;
    if(q.light!==undefined)q.m.intensity=q.light*Math.max(0,q.life/q.max);
    else if(q.step)q.step(q,dt);
    else{q.v.y-=q.g*dt;q.m.position.addScaledVector(q.v,dt);}
    if(q.m.material)q.m.material.opacity=Math.max(0,q.life/q.max)*(q.m.material.userData.o||1);
    if(q.life<=0){scene.remove(q.m);fx.splice(k,1);if(q.end)q.end();}}
  if(env){const em=env.userData.embers;if(em){const a=em.geometry.attributes.position;for(let k=0;k<a.count;k++){let y=a.getY(k)+dt*(1+(k%5)*.4);if(y>15)y=0;a.setY(k,y);}a.needsUpdate=true;}
    const mo=env.userData.motes;if(mo){const a=mo.geometry.attributes.position;for(let k=0;k<a.count;k++){let x=a.getX(k),y=a.getY(k);
      if(env.userData.mode==='wind'){x+=dt*7;y-=dt*1.2;if(x>15){x=-15;y=Math.random()*9;}if(y<0)y=9;}
      else{x+=Math.cos(t*.6+k)*dt*.4;y+=Math.sin(t*.8+k*1.3)*dt*.35;}
      a.setX(k,x);a.setY(k,y);}a.needsUpdate=true;mo.material.opacity=.6+Math.sin(t*3)*.3;}}
  if(composer)composer.render();else if(renderer)renderer.render(scene,camera);
}

const foes=[{n:'🟢 슬라임',hp:40,atk:[4,7]},{n:'👺 고블린',hp:60,atk:[6,10]},{n:'👹 오크 전사',hp:85,atk:[8,13]},{n:'💀 다크 나이트',hp:110,atk:[10,16]},{n:'🐉 고대 드래곤',hp:160,atk:[12,20]}];
let p,e,stage,busy,over,logs;
function log(s){logs.unshift(s);logs=logs.slice(0,3);$('log').innerHTML=logs.map(x=>'<div>'+x+'</div>').join('');}
function banner(s){$('banner').textContent=s;$('banner').style.display='block';}
function plan(){e.next=Math.random()<.25?'charge':'atk';}
function setBar(id,v){$(id+'b').style.width=v+'%';const g=$(id+'g');if(g)g.style.width=v+'%';}
function draw(){
  $('php').textContent=Math.max(0,p.hp)+' / '+p.max;setBar('php',Math.max(0,p.hp/p.max*100));
  $('pmp').textContent=p.mp+' / '+p.mmax;setBar('pmp',p.mp/p.mmax*100);
  $('pst').textContent='Lv.'+p.lv+(p.def?' · 방어 중':'');
  $('en').textContent=e.n;$('est').textContent='STAGE '+(stage+1)+' / '+foes.length;
  $('ehp').textContent=Math.max(0,e.hp)+' / '+e.max;setBar('ehp',Math.max(0,e.hp/e.max*100));
  const it=$('eint');it.textContent=e.charge?'⚠️ 강공격 준비!':(e.next==='charge'?'힘을 모으려 함':'공격');it.className=e.charge?'warn':'';
  $('vig').classList.toggle('low',!over&&p.hp>0&&p.hp/p.max<.3);}
function intro(i){$('i1').textContent='STAGE '+(i+1);$('i2').textContent=envCfg[i].t;$('i3').textContent='VS  '+foes[i].n;const el=$('intro');el.classList.remove('go');void el.offsetWidth;el.classList.add('go');}
function spawn(){buildStage(stage);if(monster)scene.remove(monster);monster=makeMonster(stage);monster.userData.enter=0;applyEnv(monster);scene.add(monster);
  const f=foes[stage];e={n:f.n,hp:f.hp,max:f.hp,atk:f.atk,charge:false};plan();draw();intro(stage);
  busy=true;setTimeout(()=>{busy=false;},1300);}
function reset(){p={hp:60,max:60,mp:20,mmax:20,lv:1,def:false};stage=0;logs=[];over=false;victory=false;
  hero.userData.dying=false;hero.userData.dt=0;shield.visible=false;$('scene').classList.remove('dead');$('banner').style.display='none';$('msg').textContent='';spawn();log('전투 시작! 몬스터 5마리를 쓰러뜨리세요.');}
function act(a){
  if(over){$('msg').textContent='게임이 끝났어요. 처음부터를 눌러 다시 시작하세요.';return;}
  if(busy)return;
  if(a==='skill'&&p.mp<8){$('msg').textContent='MP가 부족해요.';return;}
  if(a==='heal'&&p.mp<6){$('msg').textContent='MP가 부족해요.';return;}
  $('msg').textContent='';busy=true;p.def=false;shield.visible=false;
  const base=5+p.lv*2;
  if(a==='atk'){
    lunge(hero);setFocus(1.4,-3.5,.8,700);
    setTimeout(()=>{const crit=Math.random()<.15;const d=R(base,base+5)*(crit?2:1);p.mp=Math.min(p.mmax,p.mp+2);
      slash(monster,crit?0xffd84a:0xffffff);if(crit){slash(monster,0xffd84a);slowT=.4;}
      cam.sh=crit?.6:.25;e.hp-=d;hit(monster,d,crit);log((crit?'💥 치명타! ':'')+'용사의 공격 → '+e.n+'에게 '+d+' 피해');draw();after();},230);
  }
  if(a==='skill'){
    p.mp-=8;draw();lunge(hero);setFocus(0,-2.5,0,1000);
    setTimeout(()=>fireball(hero,monster,()=>{const d=R(base*2,base*2+8);const c=center(monster);
      burst(c,0xff7a1a,40,{sp:10});burst(c,0xffd040,20,{sp:6});ring(new THREE.Vector3(monster.position.x,.1,0),0xff8a3d,5,.55);flashLight(c,0xff6020,3);
      cam.sh=.7;e.hp-=d;hit(monster,d,false,0xffa040);log('🔥 화염베기! '+e.n+'에게 '+d+' 피해');draw();after();}),180);
  }
  if(a==='heal'){p.mp-=6;const h=R(18,26);p.hp=Math.min(p.max,p.hp+h);
    burst(new THREE.Vector3(hero.position.x,.2,0),0x6dffa8,30,{up:true});ring(new THREE.Vector3(hero.position.x,.08,0),0x6dffa8,2.5,.8);flashLight(center(hero),0x40ff90,3);
    pop(hero,'+'+h,'#7dffb0');log('💚 회복 마법으로 HP '+h+' 회복');draw();setTimeout(after,450);}
  if(a==='def'){p.def=true;shield.visible=true;p.mp=Math.min(p.mmax,p.mp+4);ring(new THREE.Vector3(hero.position.x,1.3,0),0x6cc8ff,2.2,.4);log('🛡️ 방어 자세 (MP +4)');draw();setTimeout(after,400);}
}
function after(){if(e.hp<=0){win();return;}setTimeout(enemy,600);}
function enemy(){
  if(e.next==='charge'&&!e.charge){e.charge=true;burst(center(monster),0xff3030,20,{up:true});log('⚠️ '+e.n+'이(가) 힘을 모은다…');draw();busy=false;return;}
  lunge(monster);setFocus(-1.4,-3.5,-.8,700);
  setTimeout(()=>{let d=R(e.atk[0],e.atk[1]);const big=e.charge;if(big){d=Math.round(d*2.2);e.charge=false;}
    if(p.def){d=Math.round(d*.35);burst(center(hero),0x6cc8ff,16,{sp:6});ring(new THREE.Vector3(hero.position.x,1.3,0),0x9fe0ff,2,.3);}
    slash(hero,big?0xff3030:0xff8080);if(big){slash(hero,0xff3030);slowT=.35;ring(new THREE.Vector3(hero.position.x,.1,0),0xff4040,5,.6);}
    cam.sh=big?.9:.35;p.hp-=d;hit(hero,d,false,0xff6060);log(e.n+(big?'의 강공격! ':'의 공격 → ')+'용사에게 '+d+' 피해'+(p.def?' (방어)':''));
    if(!e.charge)plan();draw();busy=false;
    if(p.hp<=0){over=true;shield.visible=false;hero.userData.dying=true;hero.userData.dt=0;$('scene').classList.add('dead');draw();banner('패배… STAGE '+(stage+1)+'에서 쓰러졌습니다');}
  },230);
}
function win(){
  log('✨ '+e.n+' 처치!');monster.userData.dying=true;e.charge=false;burst(center(monster),0xffffff,30,{sp:9});flashLight(center(monster),0xffffff,2.5);stage++;
  if(stage>=foes.length){over=true;busy=false;draw();
    setTimeout(()=>{victory=true;banner('🏆 모든 몬스터를 물리쳤습니다. 승리!');
      let n=0;const iv=setInterval(()=>{burst(new THREE.Vector3(hero.position.x+(Math.random()-.5)*6,3+Math.random()*2,(Math.random()-.5)*4),[0xffd84a,0xff6a8a,0x6cc8ff,0x7dffb0][n%4],25,{sp:7,life:1.2});if(++n>10)clearInterval(iv);},250);},800);return;}
  p.lv++;p.max+=12;p.mmax+=4;p.hp=Math.min(p.max,p.hp+Math.round(p.max*.4));p.mp=p.mmax;
  setTimeout(()=>{burst(new THREE.Vector3(hero.position.x,.2,0),0xffd84a,30,{up:true});pop(hero,'LEVEL UP!','#ffd84a');},500);
  setTimeout(()=>{$('fade').style.opacity=1;setTimeout(()=>{spawn();log('⬆️ 레벨 업! Lv.'+p.lv+' · 다음 전장으로');$('fade').style.opacity=0;},450);},1300);
}
reset();loop();
</script>
