<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 배틀게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#07060c;color:#fff;font-family:"Noto Sans KR",system-ui,sans-serif}
.hf{font-family:"Nanum Myeongjo",serif;font-weight:800;letter-spacing:.5px}
#scene{position:fixed;inset:0;z-index:0;transition:filter 1.2s}
#scene.dead{filter:grayscale(.9) brightness(.6)}
#scene canvas{display:block}
#vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6) 100%)}
#vig.low{animation:low 1s infinite}
@keyframes low{50%{box-shadow:inset 0 0 120px rgba(255,0,0,.55)}}
#grain{position:fixed;inset:-50%;z-index:1;pointer-events:none;opacity:.06;mix-blend-mode:overlay;animation:grain .6s steps(5) infinite}
@keyframes grain{20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-4%)}60%{transform:translate(-4%,-1%)}80%{transform:translate(3%,3%)}}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .4s;z-index:3}
.top,.bottom{position:fixed;left:0;right:0;z-index:2;max-width:820px;margin:0 auto;padding:12px}
.top{top:0}.bottom{bottom:0}
.glass{background:linear-gradient(180deg,rgba(22,20,24,.78),rgba(8,8,10,.82));border:1px solid rgba(214,186,130,.32);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.45);backdrop-filter:blur(6px)}
.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.logo{font-size:26px;background:linear-gradient(180deg,#fff6d0,#f2b544 55%,#b9751a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 3px rgba(0,0,0,.8))}
#place{font-size:14px;margin-left:10px;color:#f5e6c0;text-shadow:0 1px 4px #000}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{padding:10px 14px}
.name{font-size:18px;display:flex;align-items:baseline;gap:8px}
.st{font-size:12px;opacity:.75;font-family:"Noto Sans KR",sans-serif}
.lbl{font-size:12px;display:flex;justify-content:space-between;margin-top:6px;color:#e8e0d0}
.bar{position:relative;height:13px;border-radius:7px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);overflow:hidden;margin-top:3px}
.bar>div{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.ghost{background:#fff6e0;opacity:.85;transition:width .7s ease .3s}
.fill{transition:width .25s}
.fill::after{content:"";position:absolute;left:0;right:0;top:0;height:45%;background:rgba(255,255,255,.28);border-radius:7px}
.hp{background:linear-gradient(90deg,#0f9b7a,#45f0a0)}.mp{background:linear-gradient(90deg,#2a5bd7,#5cc8ff)}.ehp{background:linear-gradient(90deg,#8e0e00,#ff4b2b)}
#eint.warn{color:#ff7070;animation:blink .5s infinite}
@keyframes blink{50%{opacity:.4}}
.banner{display:none;text-align:center;font-size:24px;padding:14px;margin-top:10px}
#log{padding:8px 14px;margin-bottom:8px;min-height:70px}
#log div{font-size:13px;line-height:1.65;opacity:.55}
#log div:first-child{opacity:1;color:#fff3cf}
#msg{font-size:13px;color:#ff9b9b;min-height:18px;text-shadow:0 1px 3px #000}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.b{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px}
.ic{position:relative;width:48px;height:48px;flex:none;transition:transform .2s,filter .2s;filter:drop-shadow(0 0 4px var(--c))}
.ic svg{width:100%;height:100%;display:block}
.b:hover .ic{transform:scale(1.12) rotate(-6deg);filter:drop-shadow(0 0 12px var(--c))}
.tx{display:flex;flex-direction:column;min-width:0}
.b .tx .hf{font-size:17px}
.b kbd{position:absolute;top:4px;right:7px;font-size:10px;opacity:.45;font-family:inherit}
.b.locked{opacity:.55}.b.locked .ic{filter:grayscale(1) brightness(.5)}
.b.locked .ic::after{content:"🔒";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.b.nomp .ic{filter:grayscale(.6) brightness(.7)}
.b.hot{animation:hot 1.4s infinite}.b.hot .ic{animation:spin 6s linear infinite}
@keyframes hot{50%{box-shadow:inset 0 0 14px rgba(0,0,0,.6),0 0 22px var(--c)}}
@keyframes spin{50%{transform:scale(1.08)}}
#cast{position:fixed;left:50%;top:34%;z-index:4;display:flex;align-items:center;gap:14px;pointer-events:none;opacity:0;transform:translate(-50%,-50%);white-space:nowrap}
#cast.go{animation:cast 1.2s ease forwards}
#cast .ic{width:92px;height:92px;filter:drop-shadow(0 0 18px var(--c))}
#cast .hf{font-size:42px;color:#fff;text-shadow:0 0 6px var(--c),0 0 22px var(--c),0 3px 0 #000}
@keyframes cast{0%{opacity:0;transform:translate(-50%,-50%) scale(1.7)}14%{opacity:1;transform:translate(-50%,-50%) scale(1)}72%{opacity:1;transform:translate(-50%,-50%) scale(1.03)}100%{opacity:0;transform:translate(-50%,-75%) scale(1)}}.b.nomp .st{color:#ff8080;opacity:1}
#estat{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;min-height:4px}
.chip{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--c);color:var(--c);background:rgba(0,0,0,.35)}
@media (max-width:560px){.acts{gap:6px}.b{flex-direction:column;gap:3px;text-align:center;padding:6px 2px}.ic{width:34px;height:34px}.tx{align-items:center}.b .tx .hf{font-size:12px}.b .st{font-size:9.5px}.b kbd{display:none}#cast .ic{width:64px;height:64px}#cast .hf{font-size:28px}.logo{font-size:20px}.name{font-size:15px}}
button{font:inherit;color:#fff;cursor:pointer}
.b{--c:#f2b544;position:relative;padding:12px 8px;border-radius:12px;border:1px solid var(--c);background:linear-gradient(180deg,rgba(40,34,62,.92),rgba(14,12,26,.92));box-shadow:inset 0 0 14px rgba(0,0,0,.6);transition:box-shadow .15s,transform .1s}
.b:hover{box-shadow:inset 0 0 14px rgba(0,0,0,.6),0 0 18px var(--c)}
.b:active{transform:scale(.96)}
.b .hf{font-size:19px;display:block;color:var(--c);text-shadow:0 0 8px rgba(0,0,0,.9)}
.b .st{display:block;margin-top:2px}
.small{font-size:13px;padding:7px 12px;border-radius:10px;border:1px solid rgba(255,210,120,.45);background:rgba(20,16,32,.8)}
.dmg{position:fixed;z-index:4;pointer-events:none;font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:36px;-webkit-text-stroke:1.5px rgba(0,0,0,.85);paint-order:stroke fill;transform:translate(-50%,-50%);animation:up 1.1s ease-out forwards}
.dmg.crit{font-size:60px;color:#ffd84a;animation:crit 1.2s ease-out forwards}
@keyframes up{0%{transform:translate(-50%,-30%) scale(.6)}15%{transform:translate(-50%,-50%) scale(1.15)}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}
@keyframes crit{0%{transform:translate(-50%,-50%) scale(2.4) rotate(-8deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1) rotate(-4deg);opacity:1}100%{transform:translate(-50%,-170%) rotate(-4deg);opacity:0}}
#intro{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0}
#intro.go{animation:intro 2s ease forwards}
#intro .s1{font-size:22px;letter-spacing:8px;color:#f5e6c0}
#intro .s2{font-size:64px;background:linear-gradient(180deg,#fff6d0,#f2b544 55%,#b9751a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 6px rgba(0,0,0,.9))}
#intro .s3{font-size:28px;color:#ff6a5a;text-shadow:0 2px 6px #000}
#intro .line{width:0;height:2px;background:linear-gradient(90deg,transparent,#f2b544,transparent);margin:10px 0}
#intro.go .line{animation:line 2s ease forwards}
@keyframes intro{0%{opacity:0;transform:scale(1.4)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(.95)}}
@keyframes line{to{width:60%}}
@media (max-width:560px){#intro .s2{font-size:42px}}
#err{display:none;position:fixed;inset:0;z-index:6;align-items:center;justify-content:center;text-align:center;padding:24px}

body.menu .top,body.menu .bottom{display:none}
#ov{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at center,rgba(0,0,0,.15),rgba(0,0,0,.6))}
.panel{width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px 22px 18px;text-align:center}
.panel.wide{width:min(760px,100%)}
.logo.big{font-size:40px;display:block;margin:4px 0 2px}
.sub{color:#cfc6b4;font-size:14px;margin-bottom:14px}
.stats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 16px}
.sc{--c:#d6ba82;font-size:12px;padding:4px 10px;border-radius:12px;border:1px solid var(--c);color:var(--c);background:rgba(0,0,0,.35)}
.sc.gold,.gold{color:#ffd56a}.sc.gold{--c:#ffd56a}
.mb{display:block;width:100%;margin:8px 0;padding:13px;font-size:16px;font-family:"Nanum Myeongjo",serif;font-weight:800;border-radius:12px;border:1px solid rgba(214,186,130,.5);background:linear-gradient(180deg,rgba(46,40,34,.9),rgba(18,16,14,.9));color:#f3e6c8}
.mb:hover{box-shadow:0 0 16px rgba(242,190,90,.45)}.mb.pri{border-color:#f2be5a;color:#fff3d0;background:linear-gradient(180deg,rgba(120,84,30,.9),rgba(50,34,12,.9))}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.ph .hf{font-size:24px;color:#f3e6c8}
.reg{margin-bottom:12px;text-align:left}.regt{font-size:15px;color:#d6ba82;margin:0 0 6px 2px}
.regc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stc{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid rgba(214,186,130,.35);background:linear-gradient(180deg,rgba(40,36,30,.85),rgba(14,12,10,.85));cursor:pointer}
.stc:hover{box-shadow:0 0 14px rgba(242,190,90,.35)}.stc.boss{border-color:rgba(255,110,90,.6)}.stc.boss .stn{color:#ff8a70}.stc.done{border-color:rgba(120,220,150,.5)}
.stc.lockd{opacity:.4;cursor:default;filter:grayscale(.8)}.stc.lockd:hover{box-shadow:none}
.stn{font-size:11px;color:#bfb39b;letter-spacing:1px}.stt{font-size:17px;color:#fff3d6}.stm{font-size:12px;color:#cfc6b4}.str{font-size:11px;color:#ffd56a;margin-top:2px}
#fsword{--c:#9fdfff;position:relative;width:110px;height:210px;margin:4px auto 6px;filter:drop-shadow(0 0 10px var(--c)) drop-shadow(0 0 22px var(--c))}
#fsword svg{width:100%;height:100%}
#fsword.ham{animation:ham .28s 3}#fsword.ok{animation:okf .7s}#fsword.ng{animation:ngf .5s}
@keyframes ham{30%{transform:rotate(-8deg) translateY(4px)}60%{transform:rotate(5deg)}}
@keyframes okf{30%{transform:scale(1.15);filter:drop-shadow(0 0 20px var(--c)) drop-shadow(0 0 40px #fff)}}
@keyframes ngf{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.spk{position:absolute;left:50%;top:45%;width:5px;height:5px;border-radius:50%;animation:spk .7s ease-out forwards}
@keyframes spk{to{transform:translate(var(--x),var(--y));opacity:0}}
#fname{font-size:24px;color:#fff3d6;margin-bottom:8px}
#finfo{font-size:14px;line-height:1.9;color:#e6dcc6}#finfo .up{color:#7dffb0}#finfo .no{color:#ff8080}.warn2{color:#ff9a7a;font-size:12px}.gl{color:#a89f8c;font-size:12px}
#fres{min-height:22px;margin:8px 0 2px;font-size:15px;font-weight:700}#fres.good{color:#7dffb0}#fres.bad{color:#ff8a8a}
#fgold{font-size:13px;color:#cfc6b4;margin-top:4px}.frow{margin-top:6px}
.rt{font-size:46px}.rt.win{background:linear-gradient(180deg,#fff6d0,#f2b544 55%,#b9751a);-webkit-background-clip:text;background-clip:text;color:transparent}.rt.lose{color:#c9b8b8}
.rs{color:#cfc6b4;font-size:14px;margin:2px 0 14px}.rl{font-size:16px;margin:6px 0;color:#f0e6d0}.rl small{color:#bfb39b;font-size:12px}.rl.new{color:#9fe8ff}.rbtn{margin-top:14px}
</style>
</head>
<body>
<div id="scene"></div>
<div id="vig"></div><div id="grain"></div>
<div id="fade"></div>
<div id="cast"></div>
<div id="intro"><div class="s1 hf" id="i1"></div><div class="line"></div><div class="s2 hf" id="i2"></div><div class="line"></div><div class="s3 hf" id="i3"></div></div>
<div class="top">
  <div class="title"><div><span class="logo hf">용사의 전설</span><span id="place"></span></div><div><button class="small" id="snd" onclick="toggleSnd()">♪ 사운드 켜짐</button> <button class="small" onclick="toMenu()">≡ 메뉴</button></div></div>
  <div class="cards">
    <div class="card glass">
      <div class="name hf">용사 <span class="st" id="pst">Lv.1</span></div>
      <div class="lbl"><span>HP</span><span id="php"></span></div><div class="bar"><div class="ghost" id="phpg"></div><div class="fill hp" id="phpb"></div></div>
      <div class="lbl"><span>MP</span><span id="pmp"></span></div><div class="bar"><div class="fill mp" id="pmpb"></div></div>
    </div>
    <div class="card glass">
      <div class="name hf"><span id="en"></span><span class="st" id="est"></span></div>
      <div class="lbl"><span>HP</span><span id="ehp"></span></div><div class="bar"><div class="ghost" id="ehpg"></div><div class="fill ehp" id="ehpb"></div></div>
      <div class="lbl"><span>다음 행동</span><b id="eint"></b></div>
      <div id="estat"></div>
    </div>
  </div>
  <div class="banner glass hf" id="banner"></div>
</div>
<div class="bottom">
  <div id="log" class="glass"></div>
  <div id="msg"></div>
  <div class="acts" id="acts"></div>
</div>
<div id="ov">
 <div id="hub" class="panel glass"><div class="logo hf big">용사의 전설</div><div class="sub">5개 지역 · 10개 스테이지</div><div class="stats" id="hubStats"></div>
  <button class="mb pri" onclick="showStages()">스테이지 선택</button><button class="mb" onclick="showForge()">대장간 · 무기 강화</button></div>
 <div id="stages" class="panel glass wide"><div class="ph"><span class="hf">스테이지 선택</span><button class="small" onclick="showHub()">← 돌아가기</button></div><div class="stats" id="stStats"></div><div id="stGrid"></div></div>
 <div id="forge" class="panel glass"><div class="ph"><span class="hf">대장간</span><button class="small" onclick="showHub()">← 돌아가기</button></div>
  <div id="fsword"></div><div id="fname" class="hf"></div><div id="finfo"></div><div id="fres"></div>
  <button class="mb pri" id="fbtn" onclick="forge()">강화하기</button><div id="fgold"></div>
  <div class="frow"><button class="mb" onclick="showStages()">스테이지 선택</button></div></div>
 <div id="result" class="panel glass"></div>
</div>
<div id="err" class="glass">3D 화면을 불러오지 못했어요. 브라우저에서 WebGL이 켜져 있는지 확인해 주세요.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Sky.js"></script>
<script>
const $=id=>document.getElementById(id);
(()=>{const c=document.createElement("canvas");c.width=c.height=160;const x=c.getContext("2d"),im=x.createImageData(160,160);for(let k=0;k<im.data.length;k+=4){const v=Math.random()*255;im.data[k]=im.data[k+1]=im.data[k+2]=v;im.data[k+3]=255;}x.putImageData(im,0,0);document.getElementById("grain").style.backgroundImage="url("+c.toDataURL()+")";})();
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
let seed=1;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
let bloom,renderer,composer,scene,camera,hemi,sun,rim,env,hero,monster,shield,shieldW,aura;
const fx=[];
try{
renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.7;renderer.outputEncoding=THREE.sRGBEncoding;
$('scene').appendChild(renderer.domElement);
}catch(err){$('err').style.display='flex';}
scene=new THREE.Scene();
camera=new THREE.PerspectiveCamera(42,1,.1,400);
hemi=new THREE.HemisphereLight(0xffffff,0x444444,.8);scene.add(hemi);
sun=new THREE.DirectionalLight(0xffffff,1);sun.position.set(6,12,8);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:70});scene.add(sun.target);
scene.add(sun);
rim=new THREE.DirectionalLight(0x9fb8ff,.7);rim.position.set(-4,6,-10);scene.add(rim);
try{if(renderer&&THREE.EffectComposer&&THREE.UnrealBloomPass&&THREE.ShaderPass){composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,camera));bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.8,.45,.85);composer.addPass(bloom);if(THREE.GammaCorrectionShader)composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));}}catch(err){composer=null;}

const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8},o||{}));
const Cyl=(a,b,h,s)=>new THREE.CylinderGeometry(a,b,h,s||8);
function mk(geo,mat,x,y,z){const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);m.castShadow=true;m.receiveShadow=true;return m;}

function eyes(g,x,y,z,sp,r,col,glow){[-1,1].forEach(s=>g.add(mk(new THREE.SphereGeometry(r,10,8),S(col,glow?{emissive:col,emissiveIntensity:2}:{roughness:.2}),x,y,z+s*sp)));}
const S=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.5},o||{}));
const G=(c,i)=>S(c,{emissive:c,emissiveIntensity:i||2});
function bone(g,a,b,r,mat){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A),m=mk(new THREE.CylinderGeometry(r*.6,r,d.length(),8),mat);m.position.copy(A).add(B).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());g.add(m);return m;}
function half(r,mat,x,y,z){return mk(new THREE.SphereGeometry(r,20,12,0,Math.PI*2,0,Math.PI/2),mat,x,y,z);}

function makeHero(){
  const g=new THREE.Group(),body=new THREE.Group();g.add(body);
  const steel=S(0x98a1ae,{metalness:.9,roughness:.3}),dark=S(0x394050,{metalness:.7,roughness:.35}),gold=S(0xf0c050,{metalness:.95,roughness:.25});
  const cloth=S(0x1d4fc4,{roughness:.85,side:THREE.DoubleSide}),red=S(0xc0221a,{roughness:.8,side:THREE.DoubleSide}),leather=S(0x5a3a22,{roughness:.8}),glow=G(0x6fe6ff,2.4);
  [-1,1].forEach(s=>{
    body.add(mk(new THREE.BoxGeometry(.36,.22,.26),leather,.05,.11,s*.19));
    body.add(mk(new THREE.BoxGeometry(.38,.06,.28),gold,.05,.23,s*.19));
    body.add(mk(Cyl(.12,.11,.55,12),dark,0,.52,s*.19));
    body.add(mk(new THREE.SphereGeometry(.13,14,10),steel,.03,.78,s*.19));
  });
